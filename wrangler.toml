# Wrangler config for Cloudflare Workers
# CI/CD runs on Workers Builds (Cloudflare-native): pushes to main build & deploy
# automatically once the repo is connected in the dashboard (Worker → Settings → Build).
# The Worker name in the dashboard MUST match `name` below or builds fail.
# Manual deploys: `bun run deploy` (nuxt build && wrangler --cwd .output deploy),
# which requires `wrangler login` OR CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID env vars.
#
# One environment. There is no [env.preview] block: this is a free, public,
# read-only site with one Worker, one D1, one KV namespace and two R2 buckets.

name = "frontier-terminal"
compatibility_date = "2025-09-01"
# `queue_consumer_wait_for_wait_until` pins today's default so a future
# `compatibility_date` bump cannot flip it. The EVENTS consumer
# (layers/terminal/server/plugins/events-queue.ts) acks inside the waitUntil
# Nitro's queue() hands it; without this flag a batch would be acked before a
# single handler ran. Do not remove it.
compatibility_flags = ["nodejs_compat", "queue_consumer_wait_for_wait_until"]

# Custom domain. `custom_domain = true` makes wrangler create the DNS records
# and certificate in the frontierterm.com zone on deploy, so nothing is set up
# by hand in the dashboard. The zone must live in the same account as the Worker.
routes = [
  { pattern = "frontierterm.com", custom_domain = true },
  { pattern = "www.frontierterm.com", custom_domain = true },
]
# Once `routes` exists wrangler defaults this to false and the deploy silently
# disables the *.workers.dev origin (every request there becomes a bare 404).
# It must stay on: the judge routine's JUDGE_BASE_URL and any MCP client set up
# from the old README still point at it. server/middleware/canonical-host.ts
# redirects page requests there to the custom domain; /api and /mcp answer in
# place.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "frontier-terminal-db"
database_id = "31a693ed-7e93-48db-8375-40513d667b80"
migrations_dir = "./server/db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "ba653082105144bdb3b91a9189a72a3d"

# Raw fetched payloads (pricing pages, filings, job boards) land here so every
# derived number can be traced back to the bytes it was read from.
[[r2_buckets]]
binding = "BLOB"
bucket_name = "frontier-terminal-blob"

# The full-history bulk files (CSV and Parquet) and their manifest, written here
# by bulk:build and nothing else, so a licensee's read-only S3 token can be
# scoped to this bucket (scripts/bulk-grant.ts) and never reach BLOB's raw
# payloads or anything the public can't see. Create it once, before the deploy
# that adds this block: `bunx wrangler r2 bucket create frontier-terminal-bulk-licensed`.
# Without the binding the build still runs and keeps the full files in BLOB.
[[r2_buckets]]
binding = "BULK_LICENSED"
bucket_name = "frontier-terminal-bulk-licensed"

# Native rate limiting for the public API surface.
# server/utils/rate-limit.ts prefers this and falls back to the KV counter.
#
# Three constraints worth knowing before you touch the numbers:
#
#   * `period` must be exactly 10 or 60. There is no other value; wrangler
#     rejects the config rather than rounding, which is the good failure.
#   * `limit` and `period` are FIXED AT DEPLOY. `limit({ key })` takes only a
#     key — a caller cannot ask for a different budget at request time. So this
#     one binding enforces exactly one (limit, period) pair, and every call site
#     that wants a different pair stays on KV. That rule lives in one place:
#     NATIVE_LIMITER in server/utils/rate-limit.ts, which must MATCH the two
#     numbers below. test/rate-limit.test.ts probes the real binding and fails
#     if they ever drift.
#   * `namespace_id` is any positive integer, unique per Cloudflare ACCOUNT —
#     not an id Cloudflare issues you, and nothing to create in the dashboard.
#     Two apps on one account sharing a number share one set of counters.
#     7390 is derived from this app's name (scripts/ratelimit-namespace.ts);
#     the 60/60s limiter below is hand-picked outside that scheme.
#     Adding a second limiter means picking a different number here.
# One block per budget in use, because a block enforces exactly one. The first
# is NATIVE_LIMITER in server/utils/rate-limit.ts; every other is registered with
# registerNativeLimiter() (layers/terminal/server/utils/rate-limits.ts) under the
# same name and the same two numbers, and no two may share a (limit, period) pair.
#
# 30/60s: the two writers — /export/* and /api/judge/*.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "7390"
simple = { limit = 30, period = 60 }

# 60/60s: the public read path. Every /api/* route the terminal's pages fetch
# asks for this budget, and rendering the front page spends one from eight of
# those buckets — so this is the block that carries page-view traffic, and the
# reason it exists is latency. On KV the limiter costs a read plus a write, two
# network round-trips in front of every one of those eight calls; the binding
# runs in the runtime instead. Same budget, same enforcement, no round-trips.
[[ratelimits]]
name = "RATE_LIMITER_60"
# 1402, not 1002: the namespace is account-scoped, and 1002 is already taken by
# the template's preview limiter (30/60s) and apartment-planner's UPLOAD_LIMITER
# (10/60s). Sharing one with a different budget is exactly the collision the
# comment above warns about.
namespace_id = "1402"
simple = { limit = 60, period = 60 }

# 600/60s and 1200/60s: licensee API keys, research and systematic tier
# (KEYED_READ_LIMITERS in layers/terminal/server/utils/rate-limits.ts). Counted
# per key, not per IP. Namespaces from scripts/ratelimit-namespace.ts over
# "frontier-terminal-key-600" and "frontier-terminal-key-1200".
[[ratelimits]]
name = "RATE_LIMITER_600"
namespace_id = "2962"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_1200"
namespace_id = "7496"
simple = { limit = 1200, period = 60 }

# ─── Workers Logs ────────────────────────────────────────────────────────────
# Structured logs and the Observability tab in the dashboard, retained 7 days on
# the Paid plan (3 on Free). Without this the only way to see an error is to be
# running `wrangler tail` at the moment it happens. head_sampling_rate stays at
# 1 (log every request): traffic on a new app is low, and the first thing you
# want after a failure is the request that failed, not a sample of its neighbours.
[observability]
enabled = true
head_sampling_rate = 1

# Automatic tracing: a span for every fetch, D1, KV, R2 and Queue call, in
# requests and cron runs alike, with no SDK or code change. Logs say a cron
# failed; a trace says which call inside it was slow or threw. OTel-shaped, so
# a dashboard OTLP destination can export it later without touching code.
# Spans record full URLs, query strings included, as invocation logs already
# do. From 2026-12-01 stored traces count toward Observability billing: a fork
# that outgrows "low traffic" lowers this rate and records why in its
# divergence doc.
[observability.traces]
enabled = true
head_sampling_rate = 1

# Workers Issues: groups uncaught exceptions, failed invocations, 5xx responses
# and console.error lines into issues, and an automation pushes each new or
# recurring one to email or an agent. It covers what the ops spool cannot: a
# request that never returns, which records no 5xx and so no ops event (the
# 2026-11-07 hangs). Must stay in this file: a deploy without it turns Issues
# off. Needs wrangler 4.134+.
[observability.issues]
enabled = true

# ─── Scheduled tasks ─────────────────────────────────────────────────────────
# Every expression here must appear VERBATIM as a key in SCHEDULED_TASKS in
# nuxt.config.ts. That map is what turns a trigger into a task, and the join
# is an exact string match — a cron listed here with no matching key wakes the
# Worker on schedule and runs nothing, with no error and no log line.
# `bun run crons:check` (part of `bun run ci`) fails the build on a mismatch.
#
#   "*/30 * * * *"  ops:watch  — freshness + launch-coverage checks, then prunes ops_events
#                   poll:edgar — the two SEC feeds (layers/terminal/server/pipeline/scopes.ts)
#   "0 */6 * * *"   poll:survey — every include source: pricing, hiring, EDGAR,
#                   status pages, OpenRouter rankings — except the careers lane
#   "17 */6 * * *"  poll:careers — the ~20 MB Google careers feed, alone, so its
#                   memory never shares the survey's invocation
#                   (CAREERS_SOURCES in layers/terminal/server/pipeline/scopes.ts)
#   "*/5 * * * *"   poll:tripwire — parses the four model catalogs and polls
#                   them off-cycle only when they differ from the store
#                   cache:warm — re-renders the public pages after a deploy or poll
#                   moves the payload cache key
#                   track-record:search — the newsroom side of the track record for
#                   alerts whose window closed, and the GDELT side's search row once its
#                   files are read (layers/terminal/server/pipeline/track-record/); the files
#                   are read on GitHub Actions (.github/workflows/gdelt-search.yml)
#   "0 13 * * 1"    theses:digest — the weekly thesis digest email (layers/terminal/server/theses/digest.ts)
#                   social:digest — queues the weekly what-moved thread
#                   alerts:hiring-rollup — one hiring alert per lab for the week
#                   just ended (layers/terminal/server/pipeline/hiring-rollup.ts)
#   "0 4 * * *"     seo:indexnow — submits changed sitemap URLs to IndexNow (server/utils/indexnow.ts)
#   "41 * * * *"    events:sweep — the EVENTS queue's backstop: the social and webhook
#                   outboxes and the press briefs (see [[queues]] below)
#                   bulk:build —the bulk feed's gzipped CSVs and Parquet files in R2, built once a
#                   UTC day and resumed hourly (layers/terminal/server/utils/terminal-bulk.ts)
#
# Cron triggers run on UTC, and changes take up to 15 minutes to propagate.
[triggers]
crons = [
  "*/30 * * * *",
  "0 */6 * * *",
  "17 */6 * * *",
  "*/5 * * * *",
  "0 13 * * 1",
  "41 * * * *",
  "0 4 * * *",
]

# ─── EVENTS queue ────────────────────────────────────────────────────────────
# Alert delivery is driven by messages, not a timer
# (layers/terminal/server/utils/events.ts): writing an alert emits `alerts.new`,
# the consumer offers it to the social and webhook outboxes and the press
# briefs, then schedules each outbox's drain at its earliest due row. The
# queue carries triggers only; the outbox tables stay the record, so a lost
# message waits for the hourly events:sweep, never for nothing.
#
# YOU MUST CREATE IT FIRST: `wrangler deploy` fails on a queue that does not
# exist:
#
#     bunx wrangler queues create frontier-terminal-events
#
# One producer and one consumer naming the same queue is the Worker sending to
# itself, which is supported and the right shape: the consumer needs the same
# bindings and secrets the app already has.
[[queues.producers]]
binding = "EVENTS"
queue = "frontier-terminal-events"

[[queues.consumers]]
queue = "frontier-terminal-events"
# A second, not the 30s default: an alert's fan-out should not wait to fill a
# batch. Handlers run once per type per batch, so batching saves little.
max_batch_timeout = 1
max_batch_size = 10
# A handler that throws retries its messages a minute later
# (event-consumer.ts). Five tries span several minutes of D1 or Buffer
# trouble; past that the hourly sweep does the same work anyway. No
# dead-letter queue: a message is only its type, so a dropped one loses nothing.
max_retries = 5

# ─── Owner email ─────────────────────────────────────────────────────────────
# Outbound mail for the weekly thesis digest and the press brief
# (layers/terminal/server/utils/owner-mail.ts). Alerts are not sent from here:
# the fleet dashboard is the only alert sender. Pinned to a
# single destination on purpose: an unrestricted send binding is a spam cannon
# if the Worker is ever compromised, and this one only ever needs to reach one
# inbox. Sends to a verified destination address are free and count against no
# quota.
#
# Both addresses are ROLE addresses on this app's own zone, and that is a
# security property, not tidiness. This file is public. The owner's personal
# inbox used to be written here twice, which is a harvestable address in a
# repository anyone can clone; `alerts@frontierterm.com` forwards to it through
# an Email Routing rule instead, so the private address lives in the Cloudflare
# account and nowhere in git. Changing who reads the mail is now a routing
# rule, not a commit.
#
# Both halves are configured under Email → Email Routing on frontierterm.com:
# the rule that forwards alerts@ to a personal inbox, and alerts@ itself as a
# VERIFIED destination address — which is what lets the binding be pinned to
# it. A fork replaces both with its own, or drops this block entirely and gets
# no owner mail.
[[send_email]]
name = "OWNER_EMAIL"
destination_address = "alerts@frontierterm.com"

[vars]
NUXT_PUBLIC_APP_NAME = "Frontier Terminal"
# Canonical public origin, no trailing slash. sitemap.xml, robots.txt and og:
# tags build absolute links from this.
NUXT_PUBLIC_APP_URL = "https://frontierterm.com"
# Owner mail routing — pairs with the [[send_email]] block above. `to` must be
# the same verified destination address the binding is pinned to; `from` must
# be on a zone in this account with Email Routing enabled. Both are on
# frontierterm.com now, so the app sends and receives its own mail on its own
# domain rather than borrowing another zone's. Not secrets, and no longer
# anyone's personal address either — see the block above.
NUXT_OWNER_EMAIL_TO = "alerts@frontierterm.com"
NUXT_OWNER_EMAIL_FROM = "frontier-terminal@frontierterm.com"
# Which queue the EVENTS consumer owns. MUST equal `queue` in [[queues.consumers]]
# above (layers/terminal/nuxt.config.ts says why it is a var).
NUXT_EVENTS_QUEUE_NAME = "frontier-terminal-events"
# IndexNow ownership key. Not a secret: /indexnow-key.txt serves it.
NUXT_INDEXNOW_KEY = "fe2738e740b8c6b06a20d76ab1877559"

# Secrets — set via `wrangler secret put <NAME>`, never in this file.
#
#   NUXT_FLEET_TOKEN             bearer the portfolio dashboard presents to /api/fleet.
#                                32+ chars (`openssl rand -base64 32`). Unset = the
#                                route 404s and the app is simply not on the dashboard.
#   NUXT_FLEET_TOKEN_PREVIOUS    only during a rotation — server/utils/fleet-auth.ts.
#   NUXT_PRESS_LIST              JSON press list for the press briefs (layers/terminal/server/pipeline/press.ts).
#                                Names people, so never in git. Unset = no briefs.
#   NUXT_GDELT_TOKEN             bearer the GitHub Actions GDELT job presents to /api/gdelt/*
#                                (scripts/gdelt-search.ts); the same value is the repo secret
#                                GDELT_TOKEN. 32+ chars. Unset = those routes 404, no GDELT file is read.
#   NUXT_SEC_CONTACT_EMAIL       contact address sec.gov's fair-access policy requires in
#                                the User-Agent (layers/terminal/server/pipeline/fetch.ts). Unset = the
#                                EDGAR sources are skipped as 'failed', never fetched
#                                anonymously. A secret because it is a personal address.
#   NUXT_JUDGE_TOKEN             bearer the judge routine presents to /api/judge/*
#                                (layers/terminal/server/utils/judge-auth.ts). 32+ chars. Unset = those
#                                routes 404 and no judge exists.
#   NUXT_OPENROUTER_API_KEY      bearer for openrouter.ai/api/v1/datasets/* — the usage
#                                rankings behind the demand-share panel
#                                (layers/terminal/server/pipeline/fetch.ts). Unset = that source is
#                                recorded 'skipped' each tick, never fetched anonymously.
