# Weekly run of the full merge gate against main, on a schedule rather than a push.
#
# Workers Builds runs `bun run ci` only when something is pushed, so a test that
# goes red on its own — a wall-clock comparison against a literal date, a
# dependency that publishes a breaking patch, a Cloudflare compat change — is
# discovered by whoever opens the next unrelated PR. That happened on
# 2026-08-31 in the template: a test compared a fixed date against `now` and main sat red
# for a week with nobody the wiser.
#
# This runs both halves — `bun run ci` and the browser suites — because the
# GitHub runner can launch Chromium and Workers Builds cannot.

name: Scheduled CI

on:
  schedule:
    # Mondays 06:00 UTC. Once a week is enough to bound the "red for a week"
    # window; more often just burns minutes on a repo that mostly sits still.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      - name: Merge gate
        run: bun run ci

      - name: Browser suites
        run: bun run ci:browser

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-scheduled
          path: playwright-report/
          retention-days: 7
