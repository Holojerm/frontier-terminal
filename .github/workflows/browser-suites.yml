# Browser suites — axe accessibility and the Content-Security-Policy.
#
# These live here rather than in `bun run ci` for one reason: Workers Builds
# runs as a NON-ROOT user on an image with no Chromium system libraries, so
# Playwright cannot launch a browser there. Both halves of that are proven, not
# assumed:
#
#     error while loading shared libraries: libatk-1.0.so.0:
#       cannot open shared object file: No such file or directory
#
#     $ playwright install --with-deps chromium
#     Switching to root user to install dependencies...
#     Password: su: Authentication failure
#
# `--with-deps` is the documented first fix and it cannot work without root, so
# the documented fallback applies: run them somewhere that has a browser.
# GitHub's ubuntu runners do, and `--with-deps` succeeds there.
#
# WHAT MOVED. `bun run test:a11y` is two Playwright projects, not one —
# `a11y` (axe over every public route, light and dark) and `csp` (the
# Content-Security-Policy spec). Moving it moved both, which means the
# SECURITY-HEADER gate now lives here too. That is the trap AGENTS.md warns
# about: a broken CSP fails silently, in exactly the way that gate exists to
# catch. If you ever delete this workflow, you are deleting the CSP gate.
#
# Everything else still runs in Workers Builds via `bun run ci` — lint, the
# design/brand/mirror/seo gates, typecheck, the unit tests and the build. Those
# are the gates that block a deploy; these two block a merge.

name: Browser suites

# `push` is limited to main rather than '**' because a pull-request branch
# already gets a `pull_request` run. Matching on both fired this workflow twice
# for every push to an open PR, under two different concurrency groups
# (refs/heads/… and refs/pull/N/merge), so neither cancelled the other — two
# full browser suites per push, and the stale one ran to completion.
on:
  push:
    branches:
      - main
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: browser-suites-${{ github.ref }}
  cancel-in-progress: true

# This job reads the checkout and writes nothing back. Declared explicitly
# because the default is whatever the repository setting happens to be, and
# the step that follows `bun install` runs a browser over code from a fork's
# pull request — the least authority that can still do the job is the point.
permissions:
  contents: read

jobs:
  # Trusted runs (pushes to main, PRs from branches in this repo) go to the
  # owner's Mac mini: a single-use runner in a throwaway VM with no LAN access.
  # Fork PRs stay on GitHub-hosted runners. This expression is not the security
  # boundary — a fork can edit it — the "approve all external contributors"
  # setting is; this keeps honest fork PRs off the mini without an approval.
  # While the mini is down, trusted runs fall back to ubuntu-latest too
  # (pick-runner.yml).
  route:
    uses: ./.github/workflows/pick-runner.yml
    with:
      label: mini
      trusted: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

  browser-suites:
    needs: route
    # `browser-suites` is a required check, and a job skipped because its
    # `needs` failed reports as passing. So it runs even if routing failed,
    # on ubuntu-latest.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.route.outputs.runner || '"ubuntu-latest"') }}
    timeout-minutes: 20

    steps:
      # Third-party actions are pinned to a commit, not a tag: a tag is a
      # mutable pointer in somebody else's repository, and `@v4` moving under
      # us is the shape of every actions supply-chain incident so far. The
      # trailing comment is the human-readable version; Dependabot's
      # github-actions ecosystem (.github/dependabot.yml) moves both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Not `latest`: the toolchain that runs the suite should be the one
          # `packageManager` in package.json names, or a green run here says
          # nothing about the bun that built the deploy.
          bun-version: 1.4.0

      # `.node-version` is the single source of truth for the Node that runs
      # `nuxt build`, so this cannot drift from Workers Builds.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      # Workers Builds runs `bun run ci`, which formats in place, so this is the only check
      # that the commit itself is formatted.
      - run: bun run format:check

      # Workers Builds runs `bun run ci` — email:check included — on Linux, and
      # the committed emails are compiled on whatever machine ran email:build.
      # This is where a PR proves the two agree before a fork's deploy finds out.
      - run: bun run email:check

      # Succeeds here because the runner is root-capable. This is the exact
      # command that fails on Workers Builds.
      - run: bun run playwright:install

      - name: Run axe and CSP suites
        run: bun run test:a11y

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
