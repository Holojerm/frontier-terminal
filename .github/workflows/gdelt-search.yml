# The GDELT side of the track record (scripts/gdelt-search.ts), twice an hour.
#
# Each run asks the site for the GDELT GKG files it has not read (one per
# quarter hour, ~2.5 MB zipped), reads them oldest first, and posts back the
# rows naming a tracked lab, filer or model family, which the Worker keeps and
# matches each alert against once its window closes. It runs here and not on
# the Worker's cron because a file is ~8 MB unzipped and a tick reads several. A file
# GDELT has not published ends the run quietly; a red run means our own
# /api/gdelt/* routes failed. A backlog (the queue starts at 2026-09-01)
# drains at up to 40 minutes a run.
#
# Needs the repository secret GDELT_TOKEN, the same value as the Worker's
# NUXT_GDELT_TOKEN. Without it the run passes with a warning and reads
# nothing.
#
# Cost: about a minute a run once caught up (two files, ~5 MB of
# downloads). The repo is public, so hosted minutes are free too.

name: GDELT search

on:
  schedule:
    # Minutes 23 and 53: off the top of the hour, when GitHub's scheduler is
    # busiest. Twice an hour because the scheduler drops triggers: hourly, it
    # fired 2 of 12 on 2026-11-06 and none from 08:03Z to 18:52Z on 2026-11-09
    # (issues #301, #323). A run is about a minute once caught up, and a
    # backlog run stops at 40 minutes, so the next trigger at most waits in
    # the concurrency queue below and none is cancelled.
    - cron: '23,53 * * * *'
  workflow_dispatch:

# One run at a time: two would double our rate at GDELT.
concurrency:
  group: gdelt-search
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The owner's Mac mini, light slot, or ubuntu-latest while the mini is down
  # (pick-runner.yml). The GKG files are static, with no per-IP limit, so a
  # shared GitHub IP reads them as well as the mini does.
  route:
    # Forks have no production to search for.
    if: github.repository == 'Holojerm/frontier-terminal'
    uses: ./.github/workflows/pick-runner.yml
    with:
      label: mini-light

  search:
    needs: route
    if: ${{ !cancelled() && github.repository == 'Holojerm/frontier-terminal' }}
    runs-on: ${{ fromJSON(needs.route.outputs.runner || '"ubuntu-latest"') }}
    # The script stops itself at 40 minutes; this is the backstop.
    timeout-minutes: 50

    steps:
      # Pinned to commits for the reason browser-suites.yml gives.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # No `bun install`: the script uses bun built-ins and dependency-free layer modules.
      - name: Read the unread GDELT files
        run: bun run scripts/gdelt-search.ts
        env:
          GDELT_TOKEN: ${{ secrets.GDELT_TOKEN }}
