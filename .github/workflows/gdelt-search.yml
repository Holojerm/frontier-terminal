# The GDELT side of the track record (scripts/gdelt-search.ts), by hand only.
#
# The script runs every 30 minutes on the owner's Mac mini, from a launchd job
# outside this repo (com.holojerm.job.gdelt-search, ~/agent-jobs/gdelt-search.sh).
# This workflow used to run it on a schedule, but GitHub's scheduler dropped
# most triggers: hourly, it fired 2 of 12 on 2026-11-06 and none from 08:03Z to
# 18:52Z on 2026-11-09 (issues #301, #323); twice an hour, 4 from 2026-11-19 to
# 2026-11-21 03:30Z. It stays for 'Run workflow' while the mini is down: a run
# goes to ubuntu-latest then (pick-runner.yml). Don't start one while the mini's
# job is running; the two would read the same files.
#
# Each run asks the site for the GDELT GKG files it has not read (one per
# quarter hour, ~5 MB zipped), reads them oldest first, and posts back the
# rows naming a tracked lab, filer or model family, which the Worker keeps and
# matches each alert against once its window closes. It runs here and not on
# the Worker's cron because a file is ~15 MB unzipped and a tick reads several. A file
# GDELT has not published ends the run quietly; a red run means our own
# /api/gdelt/* routes failed. A backlog (the queue starts at 2026-09-01)
# drains at up to 40 minutes a run.
#
# Here it needs the repository secret GDELT_TOKEN, the same value as the Worker's
# NUXT_GDELT_TOKEN. Without it the run passes with a warning and reads
# nothing.
#
# Cost: about a minute a run once caught up (two files, ~10 MB of
# downloads). The repo is public, so hosted minutes are free too. Until the
# archive before 2026-09-01 is read (layers/press/server/pipeline/reported/archive.ts),
# each run spends its idle minutes on it, up to the 40-minute stop.

name: GDELT search

on:
  workflow_dispatch:

# One run at a time: two would double our rate at GDELT.
concurrency:
  group: gdelt-search
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The owner's Mac mini, light slot, or ubuntu-latest while the mini is down
  # (pick-runner.yml). The GKG files are static, with no per-IP limit, so a
  # shared GitHub IP reads them as well as the mini does.
  route:
    # Forks have no production to search for.
    if: github.repository == 'Holojerm/frontier-terminal'
    uses: ./.github/workflows/pick-runner.yml
    with:
      label: mini-light

  search:
    needs: route
    if: ${{ !cancelled() && github.repository == 'Holojerm/frontier-terminal' }}
    runs-on: ${{ fromJSON(needs.route.outputs.runner || '"ubuntu-latest"') }}
    # The script stops itself at 40 minutes; this is the backstop.
    timeout-minutes: 50

    steps:
      # Pinned to commits for the reason browser-suites.yml gives.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # No `bun install`: the script uses bun built-ins and dependency-free layer modules.
      - name: Read the unread GDELT files
        run: bun run scripts/gdelt-search.ts
        env:
          GDELT_TOKEN: ${{ secrets.GDELT_TOKEN }}
