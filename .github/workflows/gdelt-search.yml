# The GDELT side of the track record (scripts/gdelt-search.ts), hourly.
#
# It runs here and not on the Worker's cron because GDELT limits its DOC API
# per IP, and Cloudflare Workers share egress IPs with every other tenant:
# from there 85% of our queries drew a 429 for traffic that was not ours.
# Each run asks the site for the due searches, queries GDELT one at a time at
# GDELT's pace (one every 6 s), and posts each answer back. A busy GDELT ends
# the run quietly; a red run means our own /api/gdelt/* routes failed.
#
# Needs the repository secret GDELT_TOKEN, the same value as the Worker's
# NUXT_GDELT_TOKEN. Without it the run passes with a warning and searches
# nothing.
#
# Cost: one small runner for under a minute an hour. The repo is public, so
# Actions minutes are free.

name: GDELT search

on:
  schedule:
    # Minute 23: off the top of the hour, when GitHub's scheduler is busiest.
    - cron: '23 * * * *'
  workflow_dispatch:

# One run at a time: two would double our rate at GDELT.
concurrency:
  group: gdelt-search
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  search:
    # Forks have no production to search for.
    if: github.repository == 'Holojerm/frontier-terminal'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Pinned to commits for the reason browser-suites.yml gives.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # No `bun install`: the script uses bun built-ins only.
      - name: Run the due GDELT searches
        run: bun run scripts/gdelt-search.ts
        env:
          GDELT_TOKEN: ${{ secrets.GDELT_TOKEN }}
