# Source registry — transcribed from docs/source-audit.md (all sources
# live-fetched 2026-08-25; full raw reports in transcripts/). This file
# transcribes the audit; it never re-derives or invents. Fixture provenance
# (fetch timestamps, trim notes): fixtures/manifest.json.
#
# Every include source and recipe carries `terms` (the publisher's terms and
# robots.txt as read, what is taken, how often) and `rights`, what a paid
# licence could cover: `ours` (facts the publisher states about itself, read
# under terms and a robots.txt that allow it; the compilation is ours),
# `upstream` (someone else's dataset, under its own licence, which travels
# with it), or `not-cleared` (no stated licence, unread terms, or a robots or
# terms restriction: free site only, never in a paid offer). /api/coverage
# and /contact read both. A source is `ours` only when both its terms and its
# robots.txt were read and neither restricts what is taken.

sources:
  openai-models-md:
    axis: pricing-catalog
    provider: openai
    url: https://developers.openai.com/api/docs/models.md
    format: Markdown tables
    diff_mechanism: body hash (ETag on pricing page)
    verdict: include
    terms: >-
      OpenAI's terms of use (openai.com/policies) answer 403 to a headless
      client, so they were not read. developers.openai.com/robots.txt allows
      everything. Taken: model ids and catalog fields, every 5 minutes (the
      launch tripwire). Not cleared for a paid offer until the terms are read.
      Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/pricing/openai-models.md
    caveats: >-
      Catalog only — the page prints no prices; they come from
      openai-pricing-md. The marketing page (openai.com/api/pricing) is
      Cloudflare-403'd to any headless client and must never be a
      dependency.

  openai-pricing-md:
    axis: pricing-catalog
    provider: openai
    url: https://developers.openai.com/api/docs/pricing.md
    format: Markdown tables (Standard / Batch / Flex / Fast, short + long context columns)
    diff_mechanism: body hash (ETag present)
    verdict: include
    terms: >-
      OpenAI's terms of use (openai.com/policies) answer 403 to a headless
      client, so they were not read. developers.openai.com/robots.txt allows
      everything. Taken: $/MTok prices per model, tier and context band, every
      30 minutes. Not cleared for a paid offer until the terms are read. Read
      2026-11-04.
    rights: not-cleared
    fixture: fixtures/pricing/openai-pricing.md
    caveats: >-
      Did not exist at the 2026-08-25 audit; live-checked 2026-09-22 as
      real markdown (text/markdown, ETag, Last-Modified) at the docs
      origin, not the 403'd marketing page. One row per model, service
      tier and context band; the Standard short-context row shares its key
      with the catalog row from openai-models-md. The "(<272K context
      length)" annotation is the short-context bound and is kept in notes,
      never read as a context window. Cache-write prices, the cyber /
      multimodal / realtime "Grouped Pricing Table" sections and per-minute
      or per-image tables are not $/MTok token pricing and are not parsed.
      Promotional windows are prose on this page ("promotional pricing is
      available at least through …") with no hard end date, so no
      effective_until is set — the price shown is the price printed.

  anthropic-models-md:
    axis: pricing-catalog
    provider: anthropic
    url: https://platform.claude.com/docs/en/models/overview.md
    format: Markdown tables
    diff_mechanism: body hash (no validators)
    verdict: include
    terms: >-
      Anthropic's Consumer Terms (anthropic.com/legal/consumer-terms) bar
      users "To crawl, scrape, or otherwise harvest data or information from
      our Services", and define the Services to include "associated apps,
      software, and websites"; the Commercial Terms carry no such clause.
      platform.claude.com/robots.txt disallows only /api/. Taken: model ids,
      context windows and cutoffs, every 5 minutes. Not in a paid offer while
      the Consumer Terms' scraping bar may reach the docs. Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/pricing/anthropic-models-overview.md
    caveats: Catalog fields (context window, cutoff); pair with anthropic-pricing-md for prices.

  anthropic-pricing-md:
    axis: pricing-catalog
    provider: anthropic
    url: https://platform.claude.com/docs/en/about-claude/pricing.md
    format: Markdown tables
    diff_mechanism: body hash (no validators)
    verdict: include
    terms: >-
      Anthropic's Consumer Terms (anthropic.com/legal/consumer-terms) bar
      users "To crawl, scrape, or otherwise harvest data or information from
      our Services", and define the Services to include "associated apps,
      software, and websites"; the Commercial Terms carry no such clause.
      platform.claude.com/robots.txt disallows only /api/. Taken: $/MTok
      prices per model and tier, every 30 minutes. Not in a paid offer while
      the Consumer Terms' scraping bar may reach the docs. Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/pricing/anthropic-pricing.md
    caveats: >-
      Audit recorded this page as semantic HTML; scaffold-time fetch
      (2026-08-25) confirmed the .md suffix serves real markdown here too.
      A model priced by prompt length prints two rows per table ("for
      prompts up to / over 100,000 tokens"): the short band is the plain
      row, the long band is tier long_context (batch_long_context in the
      batch table). The catalog page prints that model's price as "From $X /
      input MTok, From $Y / output MTok"; anthropic-models-md stores those
      figures, which are the short band, with a note saying they are a "From"
      price. A pricing cell in any other shape fails that source.

  xai-models-md:
    axis: pricing-catalog
    provider: xai
    url: https://docs.x.ai/developers/models.md
    format: Markdown tables
    diff_mechanism: body hash (1h cache TTL)
    verdict: include
    terms: >-
      xAI's Acceptable Use Policy bars "Accessing the Services through
      unauthorized automated or non-human means" (read in a browser; x.ai
      answers 403 headless). docs.x.ai/robots.txt allows everything and
      signals ai-input=yes, which is read as authorizing the free site.
      Taken: model ids, prices and context windows, every 5 minutes. Not in
      a paid offer while the AUP bar stands. Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/pricing/xai-models.md
    caveats: >-
      Long-context dual pricing: models listed with two rows (< 200k / >=
      200k prompt tokens). The marketing page (x.ai/api) is Cloudflare-403'd
      and must never be a dependency.

  google-pricing-html:
    axis: pricing-catalog
    provider: google
    url: https://aistudio.google.com/docs/pricing.md
    format: Markdoc (86 tables, one tab per tier)
    diff_mechanism: body hash (no validators)
    verdict: include — hardest parse
    terms: >-
      Google's Terms of Service (policies.google.com/terms) bar automated
      access "in violation of the machine-readable instructions on our web
      pages (for example, robots.txt files…)"; aistudio.google.com/robots.txt
      allows /docs/. Taken: $/MTok prices per model and tier, every 5 minutes.
      Prices and catalog fields the vendor states about its own product are
      facts; the keyed, timestamped compilation and its change log are ours.
      Read 2026-11-04.
    rights: ours
    fixture: fixtures/pricing/google-pricing.md
    parse_mode: agent  # the one agent-parsed source; output gated by GooglePricingOutput
    caveats: >-
      Model names live in headings above table clusters; prices carry
      dual-date promo strings ("$0.75 through Dec 31, 2026. $1.50 starting
      Jan 1, 2027."). Until 2026-11-02 this was the SSR HTML page at
      ai.google.dev/gemini-api/docs/pricing; that URL now 301s to a
      client-rendered AI Studio page with no tables, and the same content is
      served as Markdoc at the .md suffix (live-checked 2026-11-02 against
      the rendered page: same tiers, same prices). The id keeps its -html
      suffix because the stored entities are keyed on it. The ai.google.dev
      .md.txt export is not used: it flattens the line breaks the promo
      split relies on and still lists tiers the live page dropped.

  google-models-md:
    axis: pricing-catalog
    provider: google
    url: https://aistudio.google.com/docs/models.md
    format: Markdoc (model cards + endpoint tables)
    diff_mechanism: recommendation rows (class-map sentences present / absent)
    verdict: include — class-map basis only
    terms: >-
      Google's Terms of Service (policies.google.com/terms) bar automated
      access "in violation of the machine-readable instructions on our web
      pages (for example, robots.txt files…)"; aistudio.google.com/robots.txt
      allows /docs/. Taken: the vendor sentences the class map quotes, every 5
      minutes. Prices and catalog fields the vendor states about its own
      product are facts; the keyed, timestamped compilation and its change log
      are ours. Read 2026-11-04.
    rights: ours
    fixture: fixtures/pricing/google-models.md
    caveats: >-
      Did not exist at the 2026-08-25 audit. Until 2026-11-03 this was
      ai.google.dev/gemini-api/docs/models.md.txt; that URL now 301s to
      aistudio.google.com/docs/models.md.txt, which 404s, and the same page
      is served as Markdoc at the .md suffix, as google-pricing-html was
      the day before. Read only for the vendor sentences the class map
      quotes; prices and the catalog come from google-pricing-html. Each
      model card is a `{% card %}` tag whose description attribute is the
      sentence, beside a title attribute naming the model.

  meta-models-md:
    axis: pricing-catalog
    provider: meta
    url: https://dev.meta.ai/docs/models.md
    format: Markdown tables
    diff_mechanism: body hash (ETag, Last-Modified)
    verdict: include
    terms: >-
      No website terms found for dev.meta.ai (meta.com/legal/terms and
      dev.meta.ai/legal/terms answer 404); the Meta Model API terms govern API
      calls, not reading the docs. robots.txt allows /docs/. Taken: model ids
      and context windows, every 5 minutes. Not cleared for a paid offer until
      the terms are read. Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/pricing/meta-models.md
    caveats: >-
      Catalog only, like openai-models-md: the page prints model ids,
      descriptions and context windows but no prices; they come from
      meta-pricing-md. Live-fetched 2026-10-12. llama.developer.meta.com
      301-redirects to dev.meta.ai; the source is registered at the final
      URL. Only the two token-priced text lines (Muse Wonder, Muse Spark) are
      parsed. Muse Image, Muse Voice Transcribe and SAM are billed per image,
      per hour or per frame, and Muse Glimmer is open-weight with no API at
      all.

  meta-pricing-md:
    axis: pricing-catalog
    provider: meta
    url: https://dev.meta.ai/docs/pricing-rate-limits.md
    format: Markdown tables (Standard / Contributor mode columns per model line)
    diff_mechanism: body hash (ETag, Last-Modified)
    verdict: include
    terms: >-
      No website terms found for dev.meta.ai (meta.com/legal/terms and
      dev.meta.ai/legal/terms answer 404); the Meta Model API terms govern API
      calls, not reading the docs. robots.txt allows /docs/. Taken: $/MTok
      prices per model line, every 30 minutes. Not cleared for a paid offer
      until the terms are read. Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/pricing/meta-pricing.md
    caveats: >-
      One table per model line, priced per line, not per version: every
      Muse Spark version shares one price, so the parser fans the line's row
      out to each model id the table's "Models:" sentence names. Contributor
      mode is a separate model id (muse-spark-1.3-contributor) at a far lower
      price in exchange for Meta training on the caller's content; it is
      stored under its own id, never as a discount on the Standard row. Web
      search grounding, image, audio and segmentation prices are not $/MTok
      and are not parsed. Muse Wonder is in preview.

  mistral-models-md:
    axis: pricing-catalog
    provider: mistral
    url: https://docs.mistral.ai/models.md
    format: Markdown tables (current models; deprecated and retired models)
    diff_mechanism: body hash (ETag)
    verdict: include
    terms: >-
      Mistral's terms (legal.mistral.ai: consumer, commercial, usage policy)
      say nothing about automated access to its docs. docs.mistral.ai has no
      robots.txt (404). Taken: model ids, status and context, every 5 minutes.
      Prices and catalog fields the vendor states about its own product are
      facts; the keyed, timestamped compilation and its change log are ours.
      Read 2026-11-04.
    rights: ours
    fixture: fixtures/pricing/mistral-models.md
    caveats: >-
      Did not exist at the 2026-09-08 audit (the .md links answered 404);
      live-checked 2026-11-01 as real markdown. Catalog only: model, API
      name, status (GA / Public Preview), context and a summary; prices come
      from mistral-pricing-md. Only the current table is parsed, and only
      rows with an API name: Shieldstral and the Timestral models print
      none. Rows the page labels "third-party" (Z.ai GLM, DeepSeek) are
      models Mistral resells, not Mistral's, and are never stored as
      Mistral SKUs; a third-party row from a maker the parser does not
      know fails the parse so a person decides. No sentence names a
      flagship, middle or cost tier, so all three of Mistral's class-map
      cells are stated gaps (terminal-classes.ts CLASS_GAPS).

  mistral-pricing-md:
    axis: pricing-catalog
    provider: mistral
    url: https://docs.mistral.ai/inference/pricing.md
    format: Markdown tables, one per model family; price lines joined by <br> in one cell
    diff_mechanism: body hash (ETag)
    verdict: include
    terms: >-
      Mistral's terms (legal.mistral.ai: consumer, commercial, usage policy)
      say nothing about automated access to its docs. docs.mistral.ai has no
      robots.txt (404). Taken: $/MTok prices per model, every 30 minutes.
      Prices and catalog fields the vendor states about its own product are
      facts; the keyed, timestamped compilation and its change log are ours.
      Read 2026-11-04.
    rights: ours
    fixture: fixtures/pricing/mistral-pricing.md
    caveats: >-
      Live-checked 2026-11-01. Only the per-million-token lines are parsed
      (Input, Cached input, Output). OCR is priced per 1,000 pages, audio
      per minute and TTS per million characters, so those rows are skipped,
      and Voxtral Small keeps only its token lines. The Generalist table
      opens with three third-party models Mistral resells (Z.ai GLM 5.3,
      GLM 5.3 Flash, DeepSeek V4.1 Flash); they are skipped by maker name,
      the same list mistral-models-md checks against the page's own
      "third-party" label.

  openrouter-models:
    axis: pricing-cross-check
    provider: all
    url: https://openrouter.ai/api/v1/models
    format: JSON, 419 models
    diff_mechanism: 5-min cache, field diff
    verdict: include as cross-check only
    terms: >-
      OpenRouter's Terms of Service (openrouter.ai/terms, last updated
      2026-08-31), section 7, bar using "scripts, robots or any other means or
      processes … to scrape or copy any information on the Site or the
      Services"; the CC BY 4.0 grant covers the Data API datasets only, not
      this endpoint. robots.txt allows /. Taken: per-model list prices, every
      6 hours, as a cross-check that is never a source of record. Not in a
      paid offer. Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/pricing/openrouter-models.json
    caveats: >-
      Third-party restatement with no drift SLA and thin xAI coverage (6 vs
      20+ SKUs) — cross-check, never source of record.

  openrouter-rankings-daily:
    axis: demand-share
    provider: all
    url: https://openrouter.ai/api/v1/datasets/rankings-daily
    format: JSON — top 50 public models per UTC day by total tokens, plus one aggregated "other" row
    diff_mechanism: (date, model_permaslug) keys; a revised total_tokens diffs as modified; append-only window
    verdict: include — needs NUXT_OPENROUTER_API_KEY; recorded as skipped, never fetched anonymously, without it
    terms: >-
      CC BY 4.0 (openrouter.ai/docs/cookbook/administration/data-api): "You
      may copy, redistribute, and build on it, including commercially, with
      attribution to OpenRouter." The same page: "It is not intended to be
      re-served as a competing free API." Fetching needs an API key, so the
      account terms (openrouter.ai/terms) apply too. robots.txt allows /.
      Taken: tokens per model per UTC day, every 6 hours. Shown as per-lab
      shares and top models with the required citation; the raw per-model rows
      are not bulk-exported (docs/source-audit.md, 2026-11-04 addendum). Read
      2026-11-04.
    rights: upstream
    fixture: fixtures/rankings/openrouter-rankings-daily.json
    license: CC BY 4.0 (openrouter.ai/docs/cookbook/administration/data-api, read 2026-09-08)
    citation: "Source: OpenRouter (openrouter.ai/rankings), as of {meta.as_of}. Licensed under CC BY 4.0."
    caveats: >-
      OpenRouter share, not market share — one aggregator's traffic. Direct
      API and enterprise volume never route through OpenRouter, so a lab's
      share here measures its standing among developers who use an
      aggregator, not its revenue. Fetched without date parameters: the
      endpoint's default window is the trailing 30 completed UTC days, so
      every 6-hourly survey tick re-reads the same days and a late revision
      lands as a modified row. Rate limits 30 req/min per key, 500/day per
      account; this terminal uses four a day. Meta's share counts both of
      its prefixes: its own API models (meta/*) and the open-weight Llama
      line (meta-llama/*), which third parties host and bill for, so it is
      demand for Meta's models, not traffic Meta serves.

  openai-ashby:
    axis: hiring
    provider: openai
    url: https://api.ashbyhq.com/posting-api/job-board/openai
    format: JSON (dept+team inline; ~12 MB)
    diff_mechanism: UUID ids, publishedAt, ETag
    verdict: include
    terms: >-
      Ashby documents this as its public job posting API
      (developers.ashbyhq.com/docs/public-job-posting-api); Ashby's terms say
      nothing about reading it. api.ashbyhq.com has no robots.txt (401).
      Taken: title, department, team, location and dates per open role, every
      6 hours; no posting body and no names of people. Postings are facts the
      employer publishes. Read 2026-11-04.
    rights: ours
    fixture: fixtures/hiring/openai-ashby.json
    caveats: 757 roles at audit time.

  anthropic-greenhouse:
    axis: hiring
    provider: anthropic
    url: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs
    format: JSON
    diff_mechanism: numeric ids, updated_at, ETag
    verdict: include
    terms: >-
      Greenhouse (developers.greenhouse.io/job-board.html): "Job Board data is
      publicly available, so authentication is not required for any GET
      endpoints." robots.txt disallows only /embed/. Taken: title, department,
      location and dates per open role, every 6 hours; no posting body and no
      names of people. Read 2026-11-04.
    rights: ours
    fixture: fixtures/hiring/anthropic-greenhouse.json
    caveats: >-
      537 roles at audit time. Department requires the /departments join —
      the jobs endpoint carries no department field.

  anthropic-greenhouse-departments:
    axis: hiring
    provider: anthropic
    url: https://boards-api.greenhouse.io/v1/boards/anthropic/departments
    format: JSON
    diff_mechanism: numeric ids
    verdict: include (join table for anthropic-greenhouse)
    terms: >-
      Same terms and robots.txt as anthropic-greenhouse. Taken: department
      names and the job ids under each, every 6 hours. Read 2026-11-04.
    rights: ours
    fixture: fixtures/hiring/anthropic-greenhouse-departments.json
    caveats: null

  xai-greenhouse:
    axis: hiring
    provider: xai
    url: https://boards-api.greenhouse.io/v1/boards/xai/jobs
    format: JSON
    diff_mechanism: numeric ids, updated_at, ETag
    verdict: include with disclosed caveat
    terms: >-
      Same terms and robots.txt as anthropic-greenhouse. Taken: title,
      department, location, dates and company_name per open role, every 6
      hours; no posting body and no names of people. The SpaceX/xAI blend
      caveat travels with every row. Read 2026-11-04.
    rights: ours
    fixture: fixtures/hiring/xai-greenhouse.json
    caveats: >-
      262 roles at audit time; 255 at the 2026-08-25T23:08Z join re-fetch.
      Every row carries company_name "SpaceXAI" ("SpaceXSI" on all 300
      rows by 2026-11-04) — the board is an
      entity-blended SpaceX/xAI artifact of the 2025 merger, and presenting
      it as pure xAI hiring would mislead. Caveat must ship visibly wherever
      this data surfaces. What the /departments join adds is bounded
      evidence, not a fix: the 26 departments are xAI-shaped (Data Center
      121, Human Data 36, Engineering 23) with no aerospace or launch
      function, and 2 of 255 titles name a SpaceX-side program (Starlink,
      battery storage). Department requires the join — the jobs endpoint
      carries no department field.

  xai-greenhouse-departments:
    axis: hiring
    provider: xai
    url: https://boards-api.greenhouse.io/v1/boards/xai/departments
    format: JSON
    diff_mechanism: numeric ids
    verdict: include (join table for xai-greenhouse)
    terms: >-
      Same terms and robots.txt as anthropic-greenhouse. Taken: department
      names and the job ids under each, every 6 hours. Read 2026-11-04.
    rights: ours
    fixture: fixtures/hiring/xai-greenhouse-departments.json
    caveats: >-
      Departments are the board owner's own labels, not an independent
      entity split: they narrow how much SpaceX could be hiding in the blend,
      they do not prove none is.

  mistral-ashby:
    axis: hiring
    provider: mistral
    url: https://api.ashbyhq.com/posting-api/job-board/mistral.ai
    format: JSON (dept+team inline; ~2.8 MB)
    diff_mechanism: UUID ids, publishedAt, ETag
    verdict: include
    terms: >-
      Same API, terms and robots.txt as openai-ashby. Taken: title,
      department, team, location and dates per open role, every 6 hours; no
      posting body and no names of people. Read 2026-11-04.
    rights: ours
    fixture: fixtures/hiring/mistral-ashby.json
    caveats: >-
      229 roles at 2026-11-01. The board is named mistral.ai, as the Apply
      links on mistral.ai/careers show; the 2026-09-08 audit checked
      "mistral", which is 404, and cut hiring on that. Same posting API and
      shape as openai-ashby.

  google-careers:
    axis: hiring
    provider: google
    url: https://www.google.com/about/careers/applications/jobs/feed.xml
    format: XML job feed (<jobs><job>…), Alphabet-wide, ~20 MB
    diff_mechanism: numeric jobid; Last-Modified on the whole file
    verdict: include — filtered to employer DeepMind only
    terms: >-
      Google's Terms of Service bar automated access only "in violation of
      the machine-readable instructions on our web pages"; www.google.com's
      robots.txt disallows only the results page's page= parameters, not the
      feed. Taken: job id, title, employer, categories, locations and dates
      for DeepMind rows only, every 6 hours; no posting body and no names of
      people. Read 2026-11-04.
    rights: ours
    fixture: fixtures/hiring/google-careers.xml
    caveats: >-
      DeepMind roles only: the feed lists every Alphabet posting (3,380 on
      2026-11-04: Google 3,065, YouTube 173, DeepMind 142), and a
      Google-wide count would mix Search, Ads and Cloud hiring with the
      lab's. The parser keeps rows whose <employer> is "DeepMind", the
      same set deepmind.google/careers links to (company=DeepMind on the
      results page, 142 that day), and counts the rest in the run note.
      Gemini work staffed under the Google employer is not counted.
      Departments are Google's own category labels, verbatim
      (SOFTWARE_ENGINEERING); a role filed under several keeps all of them.
      careers.google.com/jobs/feed.xml 301s here. robots.txt for
      www.google.com disallows only the results page's page= parameters for
      every agent, not the feed; Google's Terms of Service bar automated
      access only "in violation of the machine-readable instructions on our
      web pages (for example, robots.txt files…)". Read 2026-11-04.

  edgar-fts:
    axis: sec
    provider: all
    url: https://efts.sec.gov/LATEST/search-index
    format: JSON
    diff_mechanism: startdt param + accession numbers
    verdict: include, narrowly scoped
    terms: >-
      US government work, not under copyright (17 U.S.C. 105). SEC fair-access
      policy
      (sec.gov/search-filings/edgar-search-assistance/accessing-edgar-data): a
      declared User-Agent naming a contact, under 10 requests a second
      (layers/terminal/server/pipeline/fetch.ts). efts.sec.gov/robots.txt
      answers 403. Taken: S-1-family hits for "Anthropic" and the filer, every
      30 minutes. Read 2026-11-04.
    rights: ours
    fixture: fixtures/sec/edgar-fts.json
    caveats: >-
      UA header required (contact email form), 10 req/s. Open keyword sweeps
      across all filers are confirmed noisy (micro-cap false positives) —
      whitelist only. Confidential DRS filings are structurally invisible
      until flipped public; we catch the public-flip moment and say so.

  edgar-fts-openai:
    axis: sec
    provider: all
    url: https://efts.sec.gov/LATEST/search-index?q=%22OpenAI%22&forms=S-1
    format: JSON
    diff_mechanism: startdt param + accession numbers
    verdict: include, narrowly scoped
    terms: >-
      US government work, not under copyright (17 U.S.C. 105). SEC fair-access
      policy
      (sec.gov/search-filings/edgar-search-assistance/accessing-edgar-data): a
      declared User-Agent naming a contact, under 10 requests a second
      (layers/terminal/server/pipeline/fetch.ts). efts.sec.gov/robots.txt
      answers 403. Taken: S-1-family hits for "OpenAI" and the filer, every 30
