  epoch-data-centers:
    company: frontier-labs
    url: https://epoch.ai/data/data_centers/data_centers.csv
    format: CSV, one row per site (96 at the audit), RFC 4180 with multi-line source fields
    verdict: include
    terms: >-
      "Epoch AI's data is free to use, distribute, and reproduce provided
      the source and authors are credited under the Creative Commons
      Attribution license" (CC BY 4.0). robots.txt allows /data/. Read
      2026-11-04.
    rights: upstream
    caveats: >-
      Epoch's estimates: 80% of power estimates fall within a factor of
      1.4, compute is mostly derived from power, and coverage starts with
      sites operational in 2024 or later. Owner and Users differ (Colossus
      is owned by SpaceXAI and used by Anthropic) and carry confidence
      tags, kept verbatim; attribute by Users at #confident or #likely.
  epoch-data-center-timelines:
    company: frontier-labs
    url: https://epoch.ai/data/data_centers/data_center_timelines.csv
    format: CSV, one row per site and dated estimate (575 at the audit, 2018-12 to 2030-01)
    verdict: include
    terms: >-
      Same license and robots.txt as epoch-data-centers. Read 2026-11-04.
    rights: upstream
    caveats: >-
      Dates after the run are Epoch's projections and are marked so.
      Epoch revises past estimates; the newest file wins, and the raw
      bytes of each version are kept.
  sec-msft-openai:
    company: openai
    url: https://data.sec.gov/submissions/CIK0000789019.json
    format: JSON submissions feed, then the newest 10-Q or 10-K instance ({prefix}-{period}_htm.xml); every fact on msft:OpenAIGlobalLlcMember
    verdict: include
    terms: >-
      SEC fair-access policy: a User-Agent naming a contact, under 10
      requests a second (layers/terminal/server/pipeline/fetch.ts). Two
      requests a tick: the submissions feed, then the newest 10-Q or 10-K's
      instance file.
    rights: ours
    caveats: >-
      Microsoft's numbers, not OpenAI's: its recognized gain or loss (us-
      gaap:NonoperatingIncomeExpense), stake, revenue and receivables from
      OpenAI and funding commitment. Microsoft uses hypothetical liquidation
      at book value and books dilution gains in the same line, so the figure
      divided by the stake is not OpenAI's result. Tagged facts are rounded
      to $0.1B except the quarter's own; equity-method results may lag by up
      to three months.
  sec-amzn-anthropic:
    company: anthropic
    url: https://data.sec.gov/submissions/CIK0001018724.json
    format: JSON submissions feed, then the newest 10-Q or 10-K instance; every fact on amzn:AnthropicMember
    verdict: include
    terms: >-
      SEC fair-access policy: a User-Agent naming a contact, under 10
      requests a second (layers/terminal/server/pipeline/fetch.ts). Two
      requests a tick: the submissions feed, then the newest 10-Q or 10-K's
      instance file.
    rights: ours
    caveats: >-
      Amazon's numbers, not Anthropic's: upward adjustments to its Anthropic
      preferred stock, shares held, the credit facility and the remaining
      performance obligation Anthropic added. Amazon tags only some of its
      Anthropic disclosures: the preferred's carrying value and the notes'
      fair value are in the filing's text, not on this member. Its marks
      follow observable prices and 12% is an ownership cap, so none of this
      is Anthropic's valuation.
