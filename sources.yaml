# Source registry — transcribed from docs/source-audit.md (all sources
# live-fetched 2026-08-25; full raw reports in transcripts/). This file
# transcribes the audit; it never re-derives or invents. Fixture provenance
# (fetch timestamps, trim notes): fixtures/manifest.json.

sources:
  openai-models-md:
    axis: pricing-catalog
    provider: openai
    url: https://developers.openai.com/api/docs/models.md
    format: Markdown tables
    diff_mechanism: body hash (ETag on pricing page)
    verdict: include
    fixture: fixtures/pricing/openai-models.md
    caveats: >-
      Catalog only — the page prints no prices; they come from
      openai-pricing-md. The marketing page (openai.com/api/pricing) is
      Cloudflare-403'd to any headless client and must never be a
      dependency.

  openai-pricing-md:
    axis: pricing-catalog
    provider: openai
    url: https://developers.openai.com/api/docs/pricing.md
    format: Markdown tables (Standard / Batch / Flex / Fast, short + long context columns)
    diff_mechanism: body hash (ETag present)
    verdict: include
    fixture: fixtures/pricing/openai-pricing.md
    caveats: >-
      Did not exist at the 2026-08-25 audit; live-checked 2026-09-22 as
      real markdown (text/markdown, ETag, Last-Modified) at the docs
      origin, not the 403'd marketing page. One row per model, service
      tier and context band; the Standard short-context row shares its key
      with the catalog row from openai-models-md. The "(<272K context
      length)" annotation is the short-context bound and is kept in notes,
      never read as a context window. Cache-write prices, the cyber /
      multimodal / realtime "Grouped Pricing Table" sections and per-minute
      or per-image tables are not $/MTok token pricing and are not parsed.
      Promotional windows are prose on this page ("promotional pricing is
      available at least through …") with no hard end date, so no
      effective_until is set — the price shown is the price printed.

  anthropic-models-md:
    axis: pricing-catalog
    provider: anthropic
    url: https://platform.claude.com/docs/en/models/overview.md
    format: Markdown tables
    diff_mechanism: body hash (no validators)
    verdict: include
    fixture: fixtures/pricing/anthropic-models-overview.md
    caveats: Catalog fields (context window, cutoff); pair with anthropic-pricing-md for prices.

  anthropic-pricing-md:
    axis: pricing-catalog
    provider: anthropic
    url: https://platform.claude.com/docs/en/about-claude/pricing.md
    format: Markdown tables
    diff_mechanism: body hash (no validators)
    verdict: include
    fixture: fixtures/pricing/anthropic-pricing.md
    caveats: >-
      Audit recorded this page as semantic HTML; scaffold-time fetch
      (2026-08-25) confirmed the .md suffix serves real markdown here too.

  xai-models-md:
    axis: pricing-catalog
    provider: xai
    url: https://docs.x.ai/developers/models.md
    format: Markdown tables
    diff_mechanism: body hash (1h cache TTL)
    verdict: include
    fixture: fixtures/pricing/xai-models.md
    caveats: >-
      Long-context dual pricing: models listed with two rows (< 200k / >=
      200k prompt tokens). The marketing page (x.ai/api) is Cloudflare-403'd
      and must never be a dependency.

  google-pricing-html:
    axis: pricing-catalog
    provider: google
    url: https://ai.google.dev/gemini-api/docs/pricing
    format: SSR HTML, 86 tables
    diff_mechanism: If-Modified-Since (real Last-Modified)
    verdict: include — hardest parse
    fixture: fixtures/pricing/google-pricing.html
    parse_mode: agent  # the one agent-parsed source; output gated by GooglePricingOutput
    caveats: >-
      Model names live in headings above table clusters; prices carry
      dual-date promo strings ("$0.75 through Dec 31, 2026. $1.50 starting
      Jan 1, 2027."). The .md trick returns a JS shell and the models page
      is client-rendered — only this pricing page is genuine SSR.

  openrouter-models:
    axis: pricing-cross-check
    provider: all
    url: https://openrouter.ai/api/v1/models
    format: JSON, 419 models
    diff_mechanism: 5-min cache, field diff
    verdict: include as cross-check only
    fixture: fixtures/pricing/openrouter-models.json
    caveats: >-
      Third-party restatement with no drift SLA and thin xAI coverage (6 vs
      20+ SKUs) — cross-check, never source of record.

  openrouter-rankings-daily:
    axis: demand-share
    provider: all
    url: https://openrouter.ai/api/v1/datasets/rankings-daily
    format: JSON — top 50 public models per UTC day by total tokens, plus one aggregated "other" row
    diff_mechanism: (date, model_permaslug) keys; a revised total_tokens diffs as modified; append-only window
    verdict: include — needs NUXT_OPENROUTER_API_KEY; recorded as skipped, never fetched anonymously, without it
    fixture: fixtures/rankings/openrouter-rankings-daily.json
    license: CC BY 4.0 (openrouter.ai/docs/cookbook/administration/data-api, read 2026-09-08)
    citation: "Source: OpenRouter (openrouter.ai/rankings), as of {meta.as_of}. Licensed under CC BY 4.0."
    caveats: >-
      OpenRouter share, not market share — one aggregator's traffic. Direct
      API and enterprise volume never route through OpenRouter, so a lab's
      share here measures its standing among developers who use an
      aggregator, not its revenue. Fetched without date parameters: the
      endpoint's default window is the trailing 30 completed UTC days, so
      every 6-hourly survey tick re-reads the same days and a late revision
      lands as a modified row. Rate limits 30 req/min per key, 500/day per
      account; this terminal uses four a day.

  openai-ashby:
    axis: hiring
    provider: openai
    url: https://api.ashbyhq.com/posting-api/job-board/openai
    format: JSON (dept+team inline; ~12 MB)
    diff_mechanism: UUID ids, publishedAt, ETag
    verdict: include
    fixture: fixtures/hiring/openai-ashby.json
    caveats: 757 roles at audit time.

  anthropic-greenhouse:
    axis: hiring
    provider: anthropic
    url: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs
    format: JSON
    diff_mechanism: numeric ids, updated_at, ETag
    verdict: include
    fixture: fixtures/hiring/anthropic-greenhouse.json
    caveats: >-
      537 roles at audit time. Department requires the /departments join —
      the jobs endpoint carries no department field.

  anthropic-greenhouse-departments:
    axis: hiring
    provider: anthropic
    url: https://boards-api.greenhouse.io/v1/boards/anthropic/departments
    format: JSON
    diff_mechanism: numeric ids
    verdict: include (join table for anthropic-greenhouse)
    fixture: fixtures/hiring/anthropic-greenhouse-departments.json
    caveats: null

  xai-greenhouse:
    axis: hiring
    provider: xai
    url: https://boards-api.greenhouse.io/v1/boards/xai/jobs
    format: JSON
    diff_mechanism: numeric ids, updated_at, ETag
    verdict: include with disclosed caveat
    fixture: fixtures/hiring/xai-greenhouse.json
    caveats: >-
      262 roles at audit time; 255 at the 2026-08-25T23:08Z join re-fetch.
      Every row carries company_name "SpaceXAI" — the board is an
      entity-blended SpaceX/xAI artifact of the 2025 merger, and presenting
      it as pure xAI hiring would mislead. Caveat must ship visibly wherever
      this data surfaces. What the /departments join adds is bounded
      evidence, not a fix: the 26 departments are xAI-shaped (Data Center
      121, Human Data 36, Engineering 23) with no aerospace or launch
      function, and 2 of 255 titles name a SpaceX-side program (Starlink,
      battery storage). Department requires the join — the jobs endpoint
      carries no department field.

  xai-greenhouse-departments:
    axis: hiring
    provider: xai
    url: https://boards-api.greenhouse.io/v1/boards/xai/departments
    format: JSON
    diff_mechanism: numeric ids
    verdict: include (join table for xai-greenhouse)
    fixture: fixtures/hiring/xai-greenhouse-departments.json
    caveats: >-
      Departments are the board owner's own labels, not an independent
      entity split: they narrow how much SpaceX could be hiding in the blend,
      they do not prove none is.

  edgar-fts:
    axis: sec
    provider: all
    url: https://efts.sec.gov/LATEST/search-index
    format: JSON
    diff_mechanism: startdt param + accession numbers
    verdict: include, narrowly scoped
    fixture: fixtures/sec/edgar-fts.json
    caveats: >-
      UA header required (contact email form), 10 req/s. Open keyword sweeps
      across all filers are confirmed noisy (micro-cap false positives) —
      whitelist only. Confidential DRS filings are structurally invisible
      until flipped public; we catch the public-flip moment and say so.

  edgar-fts-openai:
    axis: sec
    provider: all
    url: https://efts.sec.gov/LATEST/search-index?q=%22OpenAI%22&forms=S-1
    format: JSON
    diff_mechanism: startdt param + accession numbers
    verdict: include, narrowly scoped
    fixture: fixtures/sec/edgar-fts-openai.json
    caveats: >-
      The OpenAI side of the S-1 tripwire, same UA + rate rules and the same
      noise as edgar-fts: an S-1 that mentions OpenAI in its text is a hit,
      so display_names (the filer) is what the resolver matches, never the
      query term. The endpoint caps a response at 100 hits.

  edgar-submissions:
    axis: sec
    provider: all
    url: https://data.sec.gov/submissions/CIK{n}.json
    format: JSON
    diff_mechanism: accession numbers
    verdict: include, narrowly scoped
    fixture: fixtures/sec/edgar-submissions-spcx.json  # SPCX example
    caveats: >-
      Same UA + rate rules as edgar-fts. The parser keeps only the tracked
      forms (S-1, 424B4, 10-Q, 10-K, 8-K and their amendments —
      server/pipeline/parsers/sec/forms.ts); Form 4, 144, 3, 13G and D rows
      are dropped at parse so insider trades and notices never reach the
      judge as "an SEC change". SPCX is xAI's parent since the 2025 merger:
      its periodic filings are where any xAI segment disclosure would land.

  edgar-submissions-msft:
    axis: sec
    provider: all
    url: https://data.sec.gov/submissions/CIK0000789019.json
    format: JSON
    diff_mechanism: accession numbers
    verdict: include, narrowly scoped
    fixture: fixtures/sec/edgar-submissions-msft.json
    caveats: >-
      Whitelisted CIK, same form filter as edgar-submissions. Microsoft's
      10-Q/10-K carry the OpenAI equity-method and commitment disclosures;
      the terminal alerts on the filing, it does not extract the figure.

  edgar-submissions-amzn:
    axis: sec
    provider: all
    url: https://data.sec.gov/submissions/CIK0001018724.json
    format: JSON
    diff_mechanism: accession numbers
    verdict: include, narrowly scoped
    fixture: fixtures/sec/edgar-submissions-amzn.json
    caveats: >-
      Whitelisted CIK, same form filter as edgar-submissions. Amazon's
      10-Q/10-K carry the Anthropic convertible-note and investment
      disclosures; the terminal alerts on the filing, it does not extract
      the figure.

  edgar-submissions-nvda:
    axis: sec
    provider: all
    url: https://data.sec.gov/submissions/CIK0001045810.json
    format: JSON
    diff_mechanism: accession numbers
    verdict: include, narrowly scoped
    fixture: fixtures/sec/edgar-submissions-nvda.json
    caveats: Whitelisted CIK, same form filter as edgar-submissions.

  edgar-submissions-googl:
    axis: sec
    provider: all
    url: https://data.sec.gov/submissions/CIK0001652044.json
    format: JSON
    diff_mechanism: accession numbers
    verdict: include, narrowly scoped
    fixture: fixtures/sec/edgar-submissions-googl.json
    caveats: >-
      Whitelisted CIK, same form filter as edgar-submissions. Alphabet is
      Google's parent; its filings segment Google Cloud, never Gemini, so
      nothing here is a lab revenue figure (see revenue_filers).

  edgar-companyfacts-spcx:
    axis: revenue
    provider: all
    url: https://data.sec.gov/api/xbrl/companyfacts/CIK0001181412.json
    format: JSON (XBRL company facts — facts.{taxonomy}.{tag}.units.USD[])
    diff_mechanism: (tag, accession, start, end) keys; a restated value diffs as modified
    verdict: include — the one revenue filer tagged in revenue_filers
    fixture: fixtures/sec/edgar-companyfacts-spcx.json
    caveats: >-
      SpaceX consolidated revenue, not xAI's: SpaceX is xAI's parent since
      the 2025 merger and files as one registrant. Company facts carry
      non-dimensional XBRL facts only — no segment members — so whether
      SpaceX segments xAI in its 10-Q cannot be read here and is unverified.
      Read as the parent's audited top line, the ceiling any xAI figure sits
      under, never as a lab revenue number. Revenue tags are read in a fixed
      order (Revenues, RevenueFromContractWithCustomerExcludingAssessedTax,
      SalesRevenueNet) and every tag present is stored with its name; the
      reader picks per period. Same UA + rate rules as edgar-fts.

  openai-status:
    axis: status
    provider: openai
    url: https://status.openai.com/api/v2/incidents.json
    format: JSON (Statuspage v2, {page, incidents[]})
    diff_mechanism: incident ids; status/resolved_at per incident
    verdict: include
    fixture: fixtures/status/openai-status.json
    caveats: >-
      Capacity-strain proxy, not an SLA: a status page records what the
      vendor chose to post. Live-fetched 2026-09-08: 25 incidents
      (2026-08-05 to 2026-09-08), so the feed itself covers roughly one
      month and older history is only what this pipeline accumulates
      (append-only lane — an incident scrolling out of the feed is kept).
      No components on this page; the incident URL is composed from the
      feed's own page.url + /incidents/{id} (verified to resolve), not read
      from a field.

  anthropic-status:
    axis: status
    provider: anthropic
    url: https://status.claude.com/api/v2/incidents.json
    format: JSON (Statuspage v2, {page, incidents[]} with components)
    diff_mechanism: incident ids; status/resolved_at per incident
    verdict: include
    fixture: fixtures/status/anthropic-status.json
    caveats: >-
      Registered at the final URL: status.anthropic.com 301-redirects to
      status.claude.com. Live-fetched 2026-09-08: exactly 50 incidents
      (2026-07-21 to 2026-09-03), which is the page's window cap — counts
      before that date are partial until the pipeline has polled through
      it. Components name the surface (Claude API, claude.ai, Claude Code,
      Claude Cowork, Console); consumer-app incidents count alongside API
      ones, so read the component list, not just the count. Incident URL
      composed as page.url + /incidents/{id} (verified to resolve).

  google-cloud-status:
    axis: status
    provider: google
    url: https://status.cloud.google.com/incidents.json
    format: JSON array (Google Cloud incident format, not Statuspage)
    diff_mechanism: incident ids; end timestamp per incident
    verdict: include — filtered to Gemini / Vertex AI products only
    fixture: fixtures/status/google-cloud-status.json
    caveats: >-
      This is the Alphabet-wide Cloud feed; an unfiltered count would
      conflate Compute/BigQuery/Spanner outages with Gemini and mislead —
      the same reasoning that cuts Google hiring. The parser keeps ONLY
      incidents whose affected_products[].title contains "Gemini"
      (case-insensitive) or equals "Vertex AI"; everything else is
      dropped and counted in the run note. Live-fetched 2026-09-08: 6
      incidents across 40 product titles, 1 kept ("Vertex Gemini API",
      2026-02-27). Severity vocabulary is Google's (low/medium/high), not
      Statuspage's (minor/major/critical); status is the most recent
      update's status (AVAILABLE once resolved). Incident URL composed as
      status.cloud.google.com/ + uri (verified to resolve).

# CIK whitelist for EDGAR queries. MSFT, SPCX and GOOGL are transcribed from
# the audit. AMZN and NVDA were null here through the audit and the first live
# runs — the audit recorded no numbers for them — and were resolved on
# 2026-08-25 from SEC's own ticker map (sec.gov/files/company_tickers.json),
# each round-tripped through the endpoint this file names:
# data.sec.gov/submissions/CIK0001018724.json -> "AMAZON COM INC",
# data.sec.gov/submissions/CIK0001045810.json -> "NVIDIA CORP". The same
# check re-confirmed MSFT and GOOGL. NEVER fill an entry in from memory: a
# wrong CIK here silently suppresses the highest-value alert this product
# fires, and a null at least fails visibly.
cik_whitelist:
  MSFT: "0000789019"
  AMZN: "0001018724"
  NVDA: "0001045810"
  SPCX: "0001181412"
  GOOGL: "0001652044"

# Disclosed-revenue filers. One entry per tracked lab: null while the lab has
# no audited, primary-source disclosure — the /revenue panel then says so and
# shows nothing, because a press run-rate is a claim, not data. To tag a lab:
# add its ticker to cik_whitelist, register an edgar-companyfacts-<ticker>
# source above with a committed fixture, and set ticker + relation here.
# relation is `issuer` when the lab itself files (the S-1 public-flip
# moment) and `parent` when a public parent consolidates it, in which case
# the series is the parent's and is labelled as such.
revenue_filers:
  openai: null
  anthropic: null
  google: null # Alphabet (GOOGL) is public but segments Google Cloud, never Gemini — a consolidated figure would mislead
  xai:
    ticker: SPCX
    relation: parent

# Labs with no CIK yet, and how to recognise theirs the moment it exists.
# An S-1-family hit on either edgar-fts query whose FILER name (EDGAR's
# display_names, never the query term) matches `name_pattern` as a
# case-insensitive regex, and matches none of `exclude`, resolves the lab's
# CIK from that filing (server/pipeline/parsers/sec/pending-filers.ts). The
# resolution is stored as a `filer` row with the filing it came from, fires
# the cik-resolved alert, joins the CIK whitelist for every later tick, and
# derives the lab's submissions and company-facts feeds (derived_sources).
# Funds and SPVs carrying a lab's name file Form D, never an S-1, which is
# why the tripwire query's form filter does most of the work; `exclude` is
# the belt to that brace. A resolution is revoked by adding the CIK to
# cik_whitelist under its own ticker and the lab to revenue_filers — the
# audited file always wins over a derived row.
pending_filers:
  exclude: Acquisition, SPAC, Fund, SPV, Trust, Series, Capital, Ventures
  anthropic:
    name_pattern: ^Anthropic\b
  openai:
    name_pattern: ^OpenAI\b

# Feeds derived at poll time from a key the store already holds. The URL is
# a template audited here; the key is never typed into code — a CIK comes
# from a `filer` row (above), a model slug from the openai-pricing-md rows.
# A derived source is polled, snapshotted, parsed and diffed like any other;
# it has no fixture of its own because the parser it shares was gated on a
# committed one (fixtures/manifest.json names it).
derived_sources:
  edgar-submissions:
    url: https://data.sec.gov/submissions/CIK{cik}.json
    from: filer
  edgar-companyfacts:
    url: https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json
    from: filer
  openai-model-md:
    url: https://developers.openai.com/api/docs/models/{slug}.md
    from: openai-priced-model
    caveats: >-
      One page per priced Standard-tier SKU on openai-pricing-md (about 40),
      each carrying the context window, max output and knowledge cutoff the
      catalog and pricing pages omit, beside the same $/MTok prices. The
      page's own "Model ID" must equal the slug it was derived for, or the
      source fails rather than storing a page under the wrong SKU.

# Department clusters read off the hiring boards. A cluster is a name match
# over each board's own department labels: a department belongs when its
# name contains one of `terms` as a whole word (case-insensitive) and none of
# `exclude`. The matched departments ship beside every cluster count so a
# reader can see exactly which labels were summed. The judge prompt
# (server/pipeline/judge/judge-explain.prompt.md) names the same terms;
# test/terminal-clusters.test.ts fails when the two drift.
department_clusters:
  physical-infrastructure:
    label: Physical infrastructure
    terms: Data Center, Infrastructure, Facilities, Energy, Construction, Compute, Hardware
    exclude: Software
    why: >-
      The binding constraint on the labs is atoms and energy, not code, and
      the hiring lane sees it first: xAI's board is roughly half Data Center
      roles, and the first judged alert on this terminal was xAI pulling its
      Memphis and Southaven infrastructure roles. Open roles in this cluster
      per lab per day are the supply-buildout signal beside the status-page
      demand-strain signal.

# Deliberate cuts — honesty is the feature (docs/source-audit.md verdicts).
cut:
  google-hiring:
    verdict: cut — display "no public feed" honestly
    reason: >-
      None usable: careers.google.com is an auth-walled SPA; the DeepMind
      Greenhouse board is vestigial (10 jobs). Alphabet-wide numbers would
      conflate Search/Ads/Cloud with Gemini and mislead.
  artificial-analysis:
    verdict: cut — external link only, never ingested
    reason: >-
      artificialanalysis.ai/data-api (read 2026-09-08) states the free API
      tier is "Internal use only; no redistribution." and that redistribution
      rights come only with a commercial package ("Commercial redistribution
      with attribution"). A public terminal republishes by definition, so the
      site is linked as a reference beside the demand-share panel and no
      figure from it is stored or shown.
  lmarena:
    verdict: cut — external link only, never ingested
    reason: >-
      arena.ai (formerly lmarena.ai; read 2026-09-08) publishes a leaderboard
      app with no documented data endpoint, dataset download, or data license.
      Scraping a page with no stated license would be a claim about that page,
      not data; it is linked as a reference beside the demand-share panel.
  compute-deals:
    verdict: stretch goal only (new-post tier, no extraction claims)
    reason: >-
      RSS detection solvable for 4 sources (Anthropic = SPA no feed; xAI =
      hard 403), but the deals that matter break in the press before any
      company feed — honest coverage is impossible, so extraction is cut.
  xai-status:
    verdict: cut — display "no public feed" honestly
    reason: >-
      status.x.ai/api/v2/incidents.json answers 403 (Cloudflare challenge
      page) to any non-browser client, live-checked 2026-09-08 with a
      descriptive User-Agent. Scraping a rendered page would be a
      dependency on a bot wall; the terminal shows the gap instead.
  mistral:
    verdict: cut — not tracked on any axis
    reason: >-
      No supported surface on either primary axis, live-checked 2026-09-08.
      Hiring: api.ashbyhq.com/posting-api/job-board/mistral answers 404
      (the board at jobs.ashbyhq.com/mistral is a 7 KB HTML shell over an
      internal GraphQL endpoint, not the posting API). Pricing:
      mistral.ai/pricing is a 485 KB client-side HTML app (same bytes at
      docs.mistral.ai/deployment/laplateforme/pricing) with no markdown or
      JSON endpoint; docs.mistral.ai/llms.txt lists a Pricing and a Models
      Overview .md page, but both links answer 404 with a 462 KB HTML shell.
      An HTML parse in the Google style is conceivable; with no hiring feed
      to pair it with, a fifth lab on one axis is not worth the parser.
