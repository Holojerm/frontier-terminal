    fixture: fixtures/status/openai-status.json
    caveats: >-
      Capacity-strain proxy, not an SLA: a status page records what the
      vendor chose to post. Live-fetched 2026-09-08: 25 incidents
      (2026-08-05 to 2026-09-08), so the feed itself covers roughly one
      month and older history is only what this pipeline accumulates
      (append-only lane — an incident scrolling out of the feed is kept).
      No components on this page; the incident URL is composed from the
      feed's own page.url + /incidents/{id} (verified to resolve), not read
      from a field.

  anthropic-status:
    axis: status
    provider: anthropic
    url: https://status.claude.com/history.atom
    format: Atom (Statuspage incident history; HTML content lists each update)
    diff_mechanism: incident ids (the code in each entry's /incidents/ link); status/resolved_at per incident
    verdict: include
    terms: >-
      status.claude.com/robots.txt disallows /api/ and /embed/ for every
      agent; this Atom feed (/history.atom) is outside both, which is why the
      source moved here from the JSON API on 2026-11-04. Anthropic's Consumer
      Terms bar scraping its Services (see anthropic-models-md). Taken:
      incident id, title, status, start and resolution (no impact is
      published), every 6 hours. Not in a paid offer. Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/status/anthropic-status.xml
    caveats: >-
      Read from the Atom feed since 2026-11-04 because status.claude.com's
      robots.txt has "User-agent: *", "Disallow: /api/", "Disallow: /embed/",
      which bars the JSON API this source used before. status.anthropic.com
      301-redirects to this host. Live-fetched 2026-11-04: 25 entries
      (2026-09-03 to 2026-10-28), a shorter window than the API's 50; older
      incidents are what this pipeline already holds. The feed publishes no
      impact, so Anthropic's impact is null ("not published") and is never
      inferred from wording. Incidents that had left the Atom window by the
      switch keep the impact and components the API gave them; those still
      in it were re-read from the feed and carry neither. Components are read only from a "This
      incident affected:" line, which no entry carries today, so the list is
      empty and consumer-app incidents (claude.ai, Claude Code, Cowork,
      connectors) count alongside API ones: read the title. Status is the
      newest update's word ("Update" means unchanged and is skipped), start
      the oldest update's stamp, resolution the "Resolved" update's stamp;
      stamps print no year and stop at the minute, so the year is the one at
      or before the entry's updated time. Ids are the same Statuspage codes
      the API used, so history carries over. Incident URL read from the
      entry's link.

  google-cloud-status:
    axis: status
    provider: google
    url: https://status.cloud.google.com/incidents.json
    format: JSON array (Google Cloud incident format, not Statuspage)
    diff_mechanism: incident ids; end timestamp per incident
    verdict: include — filtered to Gemini / Vertex AI products only
    terms: >-
      Google's Terms of Service (policies.google.com/terms) bar automated
      access "in violation of the machine-readable instructions on our web
      pages (for example, robots.txt files…)";
      status.cloud.google.com/robots.txt allows everything. Taken: Gemini and
      Vertex AI incidents only (id, title, severity, status, start, end),
      every 6 hours. Read 2026-11-04.
    rights: ours
    fixture: fixtures/status/google-cloud-status.json
    caveats: >-
      This is the Alphabet-wide Cloud feed; an unfiltered count would
      conflate Compute/BigQuery/Spanner outages with Gemini and mislead —
      the same reasoning that cuts Google hiring. The parser keeps ONLY
      incidents whose affected_products[].title contains "Gemini"
      (case-insensitive) or equals "Vertex AI"; everything else is
      dropped and counted in the run note. Live-fetched 2026-09-08: 6
      incidents across 40 product titles, 1 kept ("Vertex Gemini API",
      2026-02-27). Severity vocabulary is Google's (low/medium/high), not
      Statuspage's (minor/major/critical); status is the most recent
      update's status (AVAILABLE once resolved). Incident URL composed as
      status.cloud.google.com/ + uri (verified to resolve).

  mistral-status:
    axis: status
    provider: mistral
    url: https://status.mistral.ai/api/v2/incidents.json
    format: JSON (Statuspage v2, {page, incidents[]})
    diff_mechanism: incident ids; status/resolved_at per incident
    verdict: include
    terms: >-
      Mistral's terms say nothing about automated access;
      status.mistral.ai/robots.txt answers a Cloudflare challenge (403), so
      there is no file to read. Taken: incident id, title, impact, status,
      start and resolution, every 6 hours. Not cleared for a paid offer until
      robots.txt can be read. Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/status/mistral-status.json
    caveats: >-
      Live-fetched 2026-11-01: exactly 50 incidents (2025-10-07 to
      2026-10-30), the page's window cap. No components field, so the count
      is "Mistral operations": Vibe and Le Chat incidents (8 of 50 by name)
      count alongside API and model ones, as on OpenAI's page. Incident URL
      composed as page.url + /incidents/{id}, the Statuspage path; those
      HTML pages answer 403 (Cloudflare challenge) to a headless client, so
      unlike the other status pages they could not be checked to resolve.

  xai-status:
    axis: status
    provider: xai
    url: https://status.x.ai/feed.xml
    format: RSS 2.0, one <item> per (component, incident)
    diff_mechanism: incident guid; status/resolved date per incident
    verdict: include
    terms: >-
      xAI's Acceptable Use Policy bars "Accessing the Services through
      unauthorized automated or non-human means" (read in a browser; x.ai
      answers 403 headless). robots.txt allows the feed and disallows
      /api/. Taken: incident guid, title, severity, components, start and
      end, every 6 hours. A published feed robots.txt allows is read as
      authorized for the free site; not in a paid offer while the AUP bar
      stands. Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/status/xai-status.xml
    caveats: >-
      The page is "SpaceXAI System Status" and covers every SpaceXSI
      product, Cursor's included. Live-fetched 2026-11-04: 316 items folding
      to 97 incidents (2026-08-06 to 2026-11-03), all resolved; 48 of the 97
      name only Cursor-branded components (Cursor IDE, CLI, Cloud Agents,
      Bugbot, Automations, cursor.com), 25 only Grok, API and other
      components, 24 both. Read the component list, not just the count,
      as with xAI's blended hiring board. Impact is the feed's own severity
      (disruption / outage / info), not Statuspage's scale. The feed is a
      window, so older history is what this pipeline accumulates. The
      Statuspage-style /api/v2/incidents.json and the HTML pages still
      answer 403 (Cloudflare challenge) to a headless client and robots.txt
      disallows /api/; this feed answers 200 and robots.txt allows it. The
      consumer terms (updated 2026-10-27) and the Acceptable Use Policy bar
      "unauthorized automated or non-human means"; a published RSS feed
      that robots.txt allows is read as authorized. Incident links are the
      feed's own, per component; they answer 403 to a headless client and
      could not be checked to resolve.

  openai-misalignment-reports:
    axis: disclosures
    provider: openai
    url: https://alignment.openai.com/misalignment-reports/
    format: SSR HTML — one <tbody class="report-entry"> per report, one per notice
    diff_mechanism: report slug / notice id; title, summary, model and context per entry
    verdict: include
    terms: >-
      OpenAI's terms of use (openai.com/policies) answer 403 to a headless
      client, so they were not read. alignment.openai.com has no robots.txt
      (404). Taken: each entry's title, one-sentence summary, model and
      context verbatim, every 6 hours. Short quotations of OpenAI's own words,
      with the link. Not cleared for a paid offer until the terms are read.
      Read 2026-11-04.
    rights: not-cleared
    fixture: fixtures/disclosures/openai-misalignment-reports.html
    caveats: >-
      A record of what OpenAI chose to disclose, not a count of what
      happened: a lab with a disclosure page will always show more entries
      than a lab without one, so the count is never a safety ranking.
      Live-fetched 2026-10-08: 12 reports and 3 notices. Reports carry the
      title, one-sentence observation, model and "observed during" context
      verbatim; notices (Hugging Face, DSEwiki, RubyGems) carry a summary
      and link to an update on openai.com, which answers 403 to a headless
      client, so a notice's link is stored as printed and never followed.
      Most reports are not sandbox escapes: the page covers misalignment
      broadly (deceptive compaction summaries, cross-sample messaging), and
      the escapes (DNS, file hosts, leaked keys) are some of the entries.
      The page's printed date moves when a report is revised, so it is
      stored but never wakes the judge on its own. The site's rss.xml
      stops at 2026-07-21 and lists none of these pages.

# CIK whitelist for EDGAR queries. MSFT, SPCX and GOOGL are transcribed from
# the audit. AMZN and NVDA were null here through the audit and the first live
# runs — the audit recorded no numbers for them — and were resolved on
# 2026-08-25 from SEC's own ticker map (sec.gov/files/company_tickers.json),
# each round-tripped through the endpoint this file names:
# data.sec.gov/submissions/CIK0001018724.json -> "AMAZON COM INC",
# data.sec.gov/submissions/CIK0001045810.json -> "NVIDIA CORP". The same
# check re-confirmed MSFT and GOOGL. NEVER fill an entry in from memory: a
# wrong CIK here silently suppresses the highest-value alert this product
# fires, and a null at least fails visibly. META was resolved on 2026-10-12
# the same way: company_tickers.json -> 1326801, round-tripped through
# data.sec.gov/submissions/CIK0001326801.json -> "Meta Platforms, Inc.".
cik_whitelist:
  MSFT: "0000789019"
  AMZN: "0001018724"
  NVDA: "0001045810"
  SPCX: "0001181412"
  GOOGL: "0001652044"
  META: "0001326801"

# Disclosed-revenue filers. One entry per tracked lab: null while the lab has
# no audited, primary-source disclosure — the /revenue panel then says so and
# shows nothing, because a press run-rate is a claim, not data. To tag a lab:
# add its ticker to cik_whitelist, register an edgar-companyfacts-<ticker>
# source above with a committed fixture, and set ticker + relation here.
# relation is `issuer` when the lab itself files (the S-1 public-flip
# moment) and `parent` when a public parent consolidates it, in which case
# the series is the parent's and is labelled as such. A parent may name
# `segment`, an XBRL StatementBusinessSegmentsAxis member: the series is then
# that one segment's, read off each 10-Q/10-K's own instance (the
# xbrl-segment template below), never the consolidated top line — so no
# companyfacts source is registered for it.
revenue_filers:
  openai: null
  anthropic: null
  # Alphabet reports no Gemini line. Google Cloud is the segment Gemini API
  # and Vertex AI revenue lands in, beside Workspace and GCP — the nearest
  # audited figure, labelled as the segment's, never as Gemini's.
  google:
    ticker: GOOGL
    relation: parent
    segment: goog:GoogleCloudMember
  xai:
    ticker: SPCX
    relation: parent
  meta: null # Meta Platforms (META) is public but segments Family of Apps and Reality Labs, never its model API
  mistral: null # private; no EDGAR filer (2026-11-01: "Mistral AI" appears only in CoreWeave's S-1/A as a customer)

# Labs with no CIK yet, and how to recognise theirs the moment it exists.
# An S-1-family hit on either edgar-fts query whose FILER name (EDGAR's
# display_names, never the query term) matches `name_pattern` as a
# case-insensitive regex, and matches none of `exclude`, resolves the lab's
# CIK from that filing (layers/terminal/server/pipeline/parsers/sec/pending-filers.ts). The
# resolution is stored as a `filer` row with the filing it came from, fires
# the cik-resolved alert, joins the CIK whitelist for every later tick, and
# derives the lab's submissions and company-facts feeds (derived_sources).
# Funds and SPVs carrying a lab's name file Form D, never an S-1, which is
# why the tripwire query's form filter does most of the work; `exclude` is
# the belt to that brace. A resolution is revoked by adding the CIK to
# cik_whitelist under its own ticker and the lab to revenue_filers — the
# audited file always wins over a derived row.
pending_filers:
  exclude: Acquisition, SPAC, Fund, SPV, Trust, Series, Capital, Ventures
  anthropic:
    name_pattern: ^Anthropic\b
  openai:
    name_pattern: ^OpenAI\b

# Feeds derived at poll time from a key the store already holds. The URL is
# a template audited here; the key is never typed into code — a CIK comes
# from a `filer` row (above), a model slug from the openai-pricing-md or
# google-pricing-html rows.
# A derived source is polled, snapshotted, parsed and diffed like any other;
# it has no fixture of its own because the parser it shares was gated on a
# committed one (fixtures/manifest.json names it).
derived_sources:
  edgar-submissions:
    url: https://data.sec.gov/submissions/CIK{cik}.json
    from: filer
  edgar-companyfacts:
    url: https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json
    from: filer
  xbrl-segment:
    url: https://www.sec.gov/Archives/edgar/data/{cik_number}/{accession_digits}/{prefix}-{period}_htm.xml
    from: segment-filing
    caveats: >-
      The segment's revenue as the parent reported it, not the lab's: Google
      Cloud carries Gemini API and Vertex AI sales beside Workspace and GCP,
      and Alphabet does not split them. One source per 10-Q/10-K among the
      four newest in the filer's submissions feed, so a first poll covers a
      full fiscal year and its comparatives; the lane is append-only, so
      older periods stay once read. The file is the instance SEC extracts
      from an inline-XBRL filing, named {prefix}-{period}_htm.xml after the
      primary document: prefix is the segment member's namespace prefix
      (goog), period the last calendar quarter-end before the filing date.
      Both hold for all 13 Alphabet 10-Q/10-K in the feed at 2026-11-01; a
      filer whose names differ 404s and fails the source rather than
      storing a wrong period. Only revenue on a context whose one dimension
      is the segment member is kept. Fetched on the six-hourly survey: a
      filing never changes after it is accepted.
  filing-index:
    url: https://www.sec.gov/Archives/edgar/data/{cik_number}/{accession_digits}/{accession_no}-index.htm
    from: registration-filing
    caveats: >-
      EDGAR's index page for one registration filing (S-1, S-1/A or 424B4)
      by a lab resolved from its own S-1, the three newest in its
      submissions feed. Read only for the primary document's name — the
      sequence-1 document whose Type is the filing's form — which the
      submissions feed does not carry. The page's CIK and form must match
      the filing it was derived for. Fetched on the six-hourly survey.
  prospectus-revenue:
    url: https://www.sec.gov/Archives/edgar/data/{cik_number}/{accession_digits}/{document}
    from: registration-document
    caveats: >-
      Revenue as printed in the registration statement's audited
      Consolidated Statements of Operations, read from the document itself
      because the filing tags no financial XBRL (Anthropic's S-1 of
      2026-10-26 tags only its filing-fee exhibit, and company facts carry
      nothing else). Live-checked 2026-11-02: the 14 MB document parses in
      under 20 ms. Periods come from the statement's own column headers;
      interim columns are marked unaudited, as a registration statement's
      interim financials are. Stored under the statement's row label
      ("Revenue"), not an XBRL tag. A later filing's value for the same
      period — an S-1/A, or the first 10-Q's XBRL — supersedes it. Fetched
      on the six-hourly survey.
  openai-model-md:
    url: https://developers.openai.com/api/docs/models/{slug}.md
    from: openai-priced-model
    caveats: >-
      One page per priced Standard-tier SKU on openai-pricing-md (about 40),
      each carrying the context window, max output and knowledge cutoff the
      catalog and pricing pages omit, beside the same $/MTok prices. The
      page's own "Model ID" must equal the slug it was derived for, or the
      source fails rather than storing a page under the wrong SKU.
  google-model-md:
    url: https://aistudio.google.com/docs/models/{slug}.md
    from: google-priced-model
    caveats: >-
      One page per priced Standard-tier SKU on google-pricing-html (about
      30), served as Markdoc at AI Studio's .md suffix like
      google-models-md (until 2026-11-03, markdown at ai.google.dev's
      .md.txt suffix, which now 404s). Each carries the context window the pricing page
      omits, in a "Token limits" row printed either as an input token limit
      or, on newer cards, as a unified input-and-output context window; the
      first number is stored as printed and the whole cell, with the max
      output, is the row's note. No prices. The window is shown on every
      tier of the slug, citing this page. A priced id Google wrote no page
      for (a -customtools variant, a live-only endpoint) 404s and reads as
      absent. A page can carry several model tables; the one read must name
      the slug it was derived for, or the source fails.
  openai-misalignment-report:
    url: https://alignment.openai.com/misalignment-reports/{slug}/
    from: openai-misalignment-report
    caveats: >-
      One page per report listed on openai-misalignment-reports. The page's
      metadata cell carries the dates the index omits, as "Label: value"
      lines whose labels vary report to report: the discovery date
      (Discovery / Discovered / Discovery date), the occurrence (Sample,
      Samples, Incident date, Main incident, Main sample completed — kept
      verbatim, sometimes two dates) and, on one report of nine, a printed
      Disclosure date. Time to disclosure reads the discovery date against
      the printed disclosure date where one exists, else against the
      earliest date the index has shown for the report.

# Thesis recipes (layers/terminal/server/theses/recipes/) audited in docs/source-audit.md.
# A recipe runs on the survey tick and stores into recipe_observations, never
# the lab tables, so it is registered here rather than under `sources:`;
# /api/coverage lists every recipe and reads its caveat and terms from this
# block. Recipes added before the block (the Cloudflare thesis's) carry their
# audit on their thesis journal page. Fixture provenance: fixtures/manifest.json.
#
# GPU rental prices (live-fetched 2026-11-02). Each is a first-party price
# page or a documented price API; third-party aggregators and marketplaces
# are never inputs (cut block). `terms` is what the provider's own terms say
# about automated reading, checked on the same day.
recipe_sources:
  gpu-lambda:
    company: lambda
    url: https://lambda.ai/pricing
    format: SSR HTML (HubSpot), one instance table per tab (8x, 4x, 2x, 1x), USD per GPU-hour
    verdict: include
    terms: >-
      robots.txt allows /pricing. The Terms of Service bar "web crawling which
      is not restricted to a rate so as not to impair or otherwise disrupt the
      servers being crawled"; one fetch per survey tick is that rate.
    rights: ours
    caveats: >-
      Only "Instances pricing" is read: self-serve, on demand. The 1-Click
      Clusters table above it prices 2-week-to-1-year terms and is skipped.
      Prices exclude sales tax.
  gpu-coreweave:
    company: coreweave
    url: https://www.coreweave.com/pricing
    format: SSR HTML (Webflow), one list item per instance, USD per instance-hour
    verdict: include
    terms: >-
      robots.txt allows /pricing. The Terms of Service (docs.coreweave.com)
      say nothing about automated access; no separate website terms resolve.
    rights: ours
    caveats: >-
      Priced per 8-GPU instance ("On-Demand Price: $49.24 / Hour") and
      divided by the printed GPU count. The page renders its GPU list twice;
      identical rows collapse, and two rows that disagree fail the run.
  gpu-nebius:
    company: nebius
    url: https://nebius.com/prices
    format: SSR HTML, "NVIDIA GPU Instances" table, column "On-demand, GPU-hour"
    verdict: include
    terms: >-
      robots.txt allows /prices. The Terms of Use (docs.nebius.com/legal)
      say nothing about automated access.
    rights: ours
    caveats: >-
      The preemptible column ("from $0.79") is dynamic spot pricing and is
      not read.
  gpu-crusoe:
    company: crusoe
    url: https://www.crusoe.ai/cloud/pricing
    format: SSR HTML (Webflow), a column of GPU names beside one column per price header
    verdict: include
    terms: >-
      robots.txt allows /cloud/pricing. The acceptable use policy
      (legal.crusoe.ai) bars "disruptive crawling or scraping".
    rights: ours
    caveats: >-
      Names and on-demand prices are separate lists matched by position;
      the extractor checks the header reads "GPU model On-demand Current
      spot" or, from 2026-11-03, "GPU model Current on-demand New on-demand
      starting <date>" (a scheduled change: Dec 1, 2026), reads only the
      first price column, and checks the two lists are the same length. B200 is "Contact
      sales" on demand, so Crusoe has no B200 price. The self-serve
      deployments table lower on the page prices dedicated inference
      endpoints and is skipped.
  gpu-together:
    company: together
    url: https://www.together.ai/pricing
    format: SSR HTML (Webflow), GPU Clusters table, column "ON-Demand", USD per GPU-hour
    verdict: include
    terms: >-
      robots.txt allows everything for every crawler but Google-Extended.
      The Terms of Service say nothing about automated access.
    rights: ours
    caveats: >-
      Only the GPU Clusters table is read. The dedicated endpoints table
      ($5.49 for an H100 at this fetch) is a managed inference product and is
      skipped.
  gpu-digitalocean:
    company: digitalocean
    url: https://www.digitalocean.com/pricing/gpu-droplets
    format: SSR HTML (Next.js), one card per GPU, labelled On-Demand Price or 12 Month Reserved Price
    verdict: include
    terms: >-
      robots.txt allows /pricing. The Terms of Service Agreement says
      nothing about automated access.
    rights: ours
    caveats: >-
      Only cards labelled "On-Demand Price" are read. The price sits in a
      wrapper whose component is named StrikeThrough but carries no style at
      this fetch; if the page starts striking it out for a promotion, the
      printed price is still the one stored.
  gpu-verda:
    company: verda
    url: https://verda.com/pricing
    format: SSR HTML, the on-demand "GPU instances" table, USD per instance-hour
    verdict: include
    terms: >-
      robots.txt allows everything. The Terms and Conditions bar "malicious
      automated use", not reading a page. Verda was DataCrunch; datacrunch.io
      redirects here.
    rights: ours
    caveats: >-
      Two H100 rows differ only in CPUs and RAM; both are kept, keyed by that
      configuration. The page's USD/EUR toggle serves USD by default. The
      instant clusters and serverless containers tables are other products.
  gpu-azure:
    company: microsoft
    url: https://prices.azure.com/api/retail/prices?$filter=serviceName%20eq%20'Virtual%20Machines'%20and%20priceType%20eq%20'Consumption'%20and%20contains(armSkuName,'H100')
    format: JSON, Azure Retail Prices API (documented, unauthenticated), one item per SKU, region and meter
    verdict: include
    terms: >-
      A public API Microsoft documents for unauthenticated price lookup.
      prices.azure.com has no robots.txt (404).
    rights: ours
    caveats: >-
      Linux pay-as-you-go only: Windows, Spot and Low Priority meters are
      skipped. The ND H100 v5 family is the 8-GPU SXM board; its price is
      divided by 8. The NC H100 v5 families are H100 NVL cards, kept and not
      counted. GPUs per VM come from Azure's VM size pages
      (AZURE_GPUS_PER_VM), not the API; an unknown size fails the run. Azure
      prices B200 only as GB200 systems, so it has no B200 price. The answer
      must fit one page; a NextPageLink fails the run.
  gpu-oracle:
    company: oracle
    url: https://apexapps.oracle.com/pls/apex/cetools/api/v1/products/?currencyCode=USD
    format: JSON, Oracle Cloud Price List API (documented on docs.oracle.com), one item per part number
    verdict: include
    terms: >-
      A public API Oracle's documentation points to for list prices.
      apexapps.oracle.com/robots.txt answers 403 to every client tried, so
      there is no file to read; www.oracle.com's robots.txt does not cover
      this host.
    rights: not-cleared
    caveats: >-
      Global list prices with no region. Only "Compute - GPU" parts metered
      "GPU Per Hour" are read; the NVIDIA AI Enterprise licence is software
      and is skipped, and "H100T" is not a part Oracle documents, so it is
      not read as an H100.
  sec-revenue-crwv:
    company: coreweave
    url: https://data.sec.gov/api/xbrl/companyfacts/CIK0001769628.json
    format: JSON, SEC EDGAR XBRL company facts
    verdict: include
    terms: >-
      SEC fair-access policy: a User-Agent naming a contact, under 10
      requests a second (layers/terminal/server/pipeline/fetch.ts).
    rights: ours
    caveats: >-
      CIK from sec.gov/files/company_tickers.json (CRWV -> 1769628). The
      fourth quarter is the 10-K year less its three 10-Q quarters, marked
      derived. Nebius (NBIS) files under IFRS, so no us-gaap revenue tag
      exists to read; IREN's revenue is mostly bitcoin mining and Applied
      Digital leases data-center capacity (to CoreWeave among others), so
      neither is a GPU-rental comparable. CoreWeave is shown alone.
  ramp-ai-index:
    company: frontier-labs
    url: https://ramp.com/data/ai-index
    format: Next.js HTML; the props object streamed in self.__next_f.push chunks (adoptionOverall, adoptionVendor, dataVersion), monthly
    verdict: include, derived numbers only
    terms: >-
      robots.txt allows /data/ (it disallows /*.csv). Ramp publishes no
      website terms, and the Acceptable Use Policy's "bulk scraping" bar
      covers its AI-enabled Services. The page states no license, so only
      the monthly overall and per-vendor rates are kept, each with this URL
      and its fetch time; the industry, size and state tables are not.
      Read 2026-11-04.
    rights: not-cleared
    caveats: >-
      US businesses on Ramp (over 85,000), counted as adopters for any
      positive AI spend in the month by card or bill pay: adoption, not
      spend, and not the whole economy. Google and Meta are not in the
      vendor series. Ramp restates past months between releases, so each
      release is also kept whole under <key>@<date first seen>. The page's
      bytes differ on every fetch (a trace id); a release is new only when
      the series or its dataVersion changes.
  npm-openai:
