  github-prs-claude-code:
    company: anthropic
    url: https://api.github.com/search/issues?q=is:pr "Generated with Claude Code" created:{yesterday}&per_page=1
    format: JSON, GitHub search API total_count for one UTC day; incomplete_results must be false
    verdict: include, one trend per agent
    terms: >-
      GitHub Acceptable Use Policies section 7: "Scraping does not refer to
      the collection of information through our API", and research
      publications must be open access. Needs NUXT_GITHUB_TOKEN: the
      anonymous limit is per IP. Read 2026-11-04.
    rights: not-cleared
    caveats: >-
      Public repositories only. Claude Code adds the footer to PR descriptions by default; users can turn it off, so the count is a floor. The phrase is searched in titles and bodies, so a PR quoting it is counted too. Each agent leaves a different trace,
      so agents are never compared as shares.
  github-prs-codex:
    company: openai
    url: https://api.github.com/search/issues?q=is:pr head:codex/ created:{yesterday}&per_page=1
    format: JSON, GitHub search API total_count for one UTC day; incomplete_results must be false
    verdict: include, one trend per agent
    terms: >-
